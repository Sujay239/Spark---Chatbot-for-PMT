<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<link rel="icon" type="image/png" href="logo.png"/>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PMT Spark Admin Portal</title>
  <script>
    // Automatic smart redirect based on session authentication state
    const hasToken = localStorage.getItem("authToken") || sessionStorage.getItem("authToken");
    const isAuth = localStorage.getItem("isLoggedIn") === "true" || sessionStorage.getItem("isLoggedIn") === "true";
    if (hasToken && isAuth) {
      window.location.replace("overview.html");
    } else {
      window.location.replace("login.html");
    }
  </script>
  <style>
    body {
      background: #041224;
      color: #f3f6fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: rgba(4, 28, 61, 0.7);
      border: 1px solid rgba(0, 172, 160, 0.3);
      padding: 32px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      max-width: 420px;
    }
    img {
      max-height: 48px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px;
      color: #00aca0;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    a {
      color: #f3f6fb;
      text-decoration: none;
      background: rgba(0, 172, 160, 0.15);
      border: 1px solid rgba(0, 172, 160, 0.3);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      transition: all 0.2s;
    }
    a:hover {
      background: #00aca0;
      color: #041224;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo.png" alt="Pain Management Technologies">
    <h1>Spark Admin Portal</h1>
    <p>Redirecting to secure login console...</p>
    <div class="links">
      <a href="login.html">1. Admin Login Screen</a>
      <a href="overview.html">2. Operations & Telemetry Overview</a>
      <a href="knowledge-base.html">3. Knowledge Base & Q&A Manager</a>
      <a href="session-logs.html">4. Chat Logs & Session Duration</a>
    </div>
  </div>
</body>
</html>
