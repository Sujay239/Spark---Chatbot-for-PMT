<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Spark — Smart Pain Assistance and Recovery Knowledge | PMT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --pmt-header-gradient: linear-gradient(
          120deg,
          #00aca0 0%,
          #007fac 55%,
          #041c3d 100%
        );
        --font:
          "Roboto", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        --font-display: "Roboto Condensed", var(--font);
        --pmt-accent: #00aca0;
        --pmt-primary: #007fac;
        --shadow-1: 0 10px 30px rgba(0, 0, 0, 0.18);
        --shadow-2: 0 24px 80px rgba(2, 6, 23, 0.28);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      :root {
        --pmt-bg: #ffffff;
        --pmt-surface: rgba(255, 255, 255, 0.94);
        --pmt-surface-2: rgba(4, 28, 61, 0.03);
        --pmt-text: #041c3d;
        --pmt-muted: rgba(4, 28, 61, 0.72);
        --pmt-dim: rgba(4, 28, 61, 0.56);
        --border-soft: rgba(4, 28, 61, 0.08);
        --input-bg: rgba(255, 255, 255, 0.98);
        --input-border: rgba(4, 28, 61, 0.12);
        --input-focus: rgba(0, 172, 160, 0.28);
        --chip-bg: rgba(4, 28, 61, 0.03);
        --card-bg: rgba(4, 28, 61, 0.025);
        --card-hover: rgba(4, 28, 61, 0.05);
        --assistant-bubble: rgba(4, 28, 61, 0.04);
        --user-bubble: linear-gradient(135deg, #00aca0, #007fac);
        --success-bg: rgba(34, 197, 94, 0.08);
        --warning-bg: rgba(245, 158, 11, 0.1);
      }
      body.pmt-theme-dark {
        --pmt-bg: #041224;
        --pmt-surface: rgba(8, 24, 48, 0.78);
        --pmt-surface-2: rgba(255, 255, 255, 0.03);
        --pmt-text: #f3f6fb;
        --pmt-muted: rgba(226, 234, 245, 0.78);
        --pmt-dim: rgba(226, 234, 245, 0.54);
        --border-soft: rgba(255, 255, 255, 0.08);
        --input-bg: rgba(8, 24, 48, 0.88);
        --input-border: rgba(148, 180, 214, 0.28);
        --input-focus: rgba(0, 172, 160, 0.3);
        --chip-bg: rgba(255, 255, 255, 0.04);
        --card-bg: rgba(255, 255, 255, 0.03);
        --card-hover: rgba(255, 255, 255, 0.06);
        --assistant-bubble: rgba(255, 255, 255, 0.04);
        --success-bg: rgba(34, 197, 94, 0.12);
        --warning-bg: rgba(245, 158, 11, 0.14);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--font);
        background: transparent;
        color: var(--pmt-text);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .pmt-launcher {
        position: fixed;
        right: 18px;
        bottom: calc(18px + var(--safe-bottom));
        z-index: 999999;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px 12px 12px;
        border-radius: 999px;
        border: 1px solid rgba(4, 28, 61, 0.08);
        background: rgba(255, 255, 255, 0.94);
        box-shadow: var(--shadow-1);
        color: #041c3d;
        cursor: pointer;
        user-select: none;
        backdrop-filter: blur(14px);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          background 0.15s ease;
      }
      body.pmt-theme-dark .pmt-launcher {
        border-color: rgba(255, 255, 255, 0.1);
        background: rgba(4, 18, 36, 0.86);
        color: #fff;
      }
      .pmt-launcher:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.22);
      }
      .pmt-launcher:active {
        transform: scale(0.99);
      }
      .pmt-launcher .label {
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.1px;
        white-space: nowrap;
        font-family: var(--font-display);
      }
      .pmt-shell {
        position: fixed;
        right: 18px;
        bottom: calc(78px + var(--safe-bottom));
        z-index: 999999;
        width: 430px;
        max-width: calc(100vw - 36px);
        height: min(82dvh, 760px);
        min-height: 600px;
        min-width: 340px;
        max-height: 95dvh;
        background: var(--pmt-surface);
        border: 1px solid var(--border-soft);
        border-radius: 24px;
        box-shadow: var(--shadow-2);
        overflow: hidden;
        display: none;
        backdrop-filter: blur(20px);
        container-type: inline-size;
      }
      .pmt-shell.open {
        display: block !important;
      }
      .pmt-shell.fullscreen {
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100vw !important;
        height: 100dvh !important;
        max-width: none !important;
        max-height: none !important;
        border-radius: 0;
        min-width: 100vw;
        min-height: 100dvh;
      }
      .pmt-shell.minimized {
        height: 72px !important;
        min-height: 72px !important;
        width: 360px;
        overflow: hidden;
      }
      .pmt-shell.minimized .pmt-body {
        display: none;
      }
      .pmt-shell.minimized .pmt-topbar {
        min-height: 72px;
      }
      .pmt-topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 10px 10px 16px;
        background: var(--pmt-header-gradient);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        min-height: 70px;
      }
      .pmt-topbar-left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        flex: 1 1 auto;
      }
      .pmt-logo {
        height: 46px;
        width: auto;
        object-fit: contain;
        display: block;
      }
      .pmt-beta-badge {
        font-size: 8px;
        font-weight: 700;
        text-transform: uppercase;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.2),
          rgba(255, 255, 255, 0.05)
        );
        color: #fff;
        padding: 2px 7px;
        border-radius: 100px;
        letter-spacing: 0.7px;
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        display: inline-flex;
        align-items: center;
        height: fit-content;
        margin-left: auto;
        user-select: none;
      }
      .pmt-topbar-right {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
      }
      .btn-primary,
      .btn-secondary,
      .btn-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        font-weight: 700;
        cursor: pointer;
        border: none;
        background: none;
        font-family: var(--font);
        transition:
          transform 0.15s ease,
          opacity 0.15s ease,
          background 0.15s ease;
        user-select: none;
        text-decoration: none;
      }
      .btn-primary {
        background: linear-gradient(
          135deg,
          var(--pmt-accent),
          var(--pmt-primary)
        );
        color: #fff;
        box-shadow: 0 10px 24px rgba(0, 127, 172, 0.25);
        padding: 10px 14px;
        font-size: 13px;
        white-space: nowrap;
      }
      .btn-secondary {
        color: var(--pmt-text);
        background: var(--chip-bg);
        border: 1px solid var(--border-soft);
        padding: 10px 14px;
        font-size: 13px;
        white-space: nowrap;
      }
      .btn-icon {
        width: 32px;
        height: 32px;
        border: 1px solid rgba(226, 232, 240, 0.22);
        background: rgba(4, 28, 61, 0.18);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
      }
      .btn-primary:active,
      .btn-secondary:active,
      .btn-icon:active {
        transform: scale(0.98);
      }
      .pmt-body {
        height: calc(100% - 70px);
        display: flex;
        flex-direction: column;
        background: var(--pmt-bg);
      }
      body.pmt-theme-dark .pmt-body {
        background: radial-gradient(
          circle at top,
          rgba(8, 24, 48, 0.92),
          #041224 70%
        );
      }
      .pmt-screen {
        padding: 18px 16px 16px;
        overflow: auto;
        flex: 1 1 auto;
        scroll-behavior: smooth;
      }
      .thread {
        display: flex;
        flex-direction: column;
        gap: 12px;
        animation: pmtFadeIn 0.22s ease-out;
      }
      @keyframes pmtFadeIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .hero {
        border: 1px solid var(--border-soft);
        background: var(--pmt-surface-2);
        border-radius: 22px;
        padding: 18px 16px;
        box-shadow: 0 10px 24px rgba(4, 28, 61, 0.06);
      }
      .heroBadge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--chip-bg);
        border: 1px solid var(--border-soft);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--pmt-dim);
        margin-bottom: 14px;
      }
      .heroTitle {
        margin: 0 0 8px;
        font-family: var(--font-display);
        font-size: 28px;
        line-height: 1.05;
        letter-spacing: -0.01em;
        font-weight: 700;
        color: var(--pmt-text);
      }
      .heroText {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--pmt-muted);
        max-width: 34ch;
      }
      .quickSectionTitle {
        margin: 6px 2px 2px;
        color: var(--pmt-dim);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-weight: 600;
      }
      .chip {
        border: 1px solid var(--border-soft);
        background: transparent;
        color: var(--pmt-text);
        padding: 10px 14px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        font-family: var(--font);
        transition:
          background 0.15s ease,
          transform 0.15s ease;
        text-align: left;
        white-space: normal;
        line-height: 1.3;
      }
      .chip:hover {
        background: var(--card-hover);
        transform: translateY(-1px);
      }
      .cardRow {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .homeCard {
        border: 1px solid var(--border-soft);
        border-radius: 18px;
        background: var(--card-bg);
        padding: 14px;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          background 0.15s ease;
      }
      .homeCard:hover {
        background: var(--card-hover);
        transform: translateY(-1px);
      }
      .homeCardTitle {
        margin: 0 0 4px;
        font-size: 13px;
        font-weight: 700;
        color: var(--pmt-text);
        font-family: var(--font-display);
      }
      .homeCardSub {
        margin: 0;
        font-size: 12px;
        line-height: 1.35;
        color: var(--pmt-muted);
      }
      .ctaPanel {
        border: 1px solid var(--border-soft);
        border-radius: 18px;
        padding: 14px;
        background: linear-gradient(180deg, var(--success-bg), transparent);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .ctaPanelTitle {
        margin: 0 0 4px;
        font-size: 13px;
        font-weight: 700;
        color: var(--pmt-text);
      }
      .ctaPanelText {
        margin: 0;
        font-size: 12px;
        line-height: 1.4;
        color: var(--pmt-muted);
      }
      .message {
        display: flex;
        width: 100%;
        gap: 10px;
        animation: pmtFadeIn 0.18s ease-out;
      }
      .message.assistant {
        justify-content: flex-start;
      }
      .message.user {
        justify-content: flex-end;
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          135deg,
          var(--pmt-accent),
          var(--pmt-primary)
        );
        box-shadow: 0 8px 20px rgba(0, 127, 172, 0.28);
        margin-top: 2px;
        overflow: hidden;
      }
      .avatar img {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover;
        border-radius: 999px;
      }
      .bubbleWrap {
        max-width: min(84%, 320px);
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .pmt-shell.fullscreen .bubbleWrap {
        max-width: min(84%, 800px);
      }
      .message.user .bubbleWrap {
        align-items: flex-end;
      }
      .bubbleLabel {
        font-size: 11px;
        color: var(--pmt-dim);
        font-weight: 700;
        padding: 0 2px;
      }
      .bubble {
        border-radius: 18px;
        padding: 13px 14px;
        border: 1px solid var(--border-soft);
        background: var(--assistant-bubble);
        color: var(--pmt-text);
        line-height: 1.55;
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .message.user .bubble {
        background: var(--user-bubble);
        color: #fff;
        border-color: transparent;
        box-shadow: 0 10px 28px rgba(0, 127, 172, 0.25);
      }
      .assistantActions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .microPill {
        border-radius: 999px;
        padding: 8px 11px;
        border: 1px solid var(--border-soft);
        background: var(--chip-bg);
        color: var(--pmt-text);
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        font-family: var(--font);
        text-align: left;
        white-space: normal;
        line-height: 1.3;
      }
      .microPill:hover {
        background: var(--card-hover);
      }
      .typingBubble {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 18px;
      }
      .typingBubble span {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--pmt-dim);
        display: block;
        animation: pmtBlink 1.2s infinite ease-in-out;
      }
      .typingBubble span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .typingBubble span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes pmtBlink {
        0%,
        80%,
        100% {
          opacity: 0.35;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-1px);
        }
      }
      .richAnswer p {
        margin: 0 0 10px;
      }
      .richAnswer p:last-child {
        margin-bottom: 0;
      }
      .richAnswer ul,
      .richAnswer ol {
        margin: 0 0 10px 18px;
        padding: 0;
      }
      .richAnswer li {
        margin: 0 0 6px;
      }
      .richAnswer strong {
        font-weight: 700;
        color: var(--pmt-text);
      }
      .message.user .richAnswer strong {
        color: #fff;
      }
      .richAnswer .callout {
        display: block;
        margin: 10px 0;
        padding: 10px 11px;
        border-radius: 14px;
        background: var(--warning-bg);
        border: 1px solid var(--border-soft);
        font-size: 12px;
      }
      .metaRow {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 6px;
      }
      .metaTag {
        font-size: 11px;
        font-weight: 700;
        color: var(--pmt-dim);
        background: var(--chip-bg);
        border: 1px solid var(--border-soft);
        border-radius: 999px;
        padding: 6px 10px;
      }
      .stuckCard {
        margin-top: 2px;
        border: 1px solid var(--border-soft);
        background: var(--pmt-surface-2);
        border-radius: 18px;
        padding: 14px;
      }
      .stuckTitle {
        margin: 0 0 5px;
        font-size: 13px;
        font-weight: 700;
        color: var(--pmt-text);
      }
      .stuckText {
        margin: 0 0 10px;
        font-size: 12px;
        line-height: 1.4;
        color: var(--pmt-muted);
      }
      @container (max-width: 480px) {
        .support-btn-text {
          display: none !important;
        }
      }
      @media (max-width: 520px) {
        .support-btn-text {
          display: none;
        }
        .pmt-shell {
          right: 12px;
          left: 12px;
          width: auto;
          bottom: calc(76px + var(--safe-bottom));
          height: min(86dvh, 760px);
          min-height: 540px;
          min-width: auto;
          max-width: calc(100vw - 24px);
        }
        .heroTitle {
          font-size: 26px;
        }
        .cardRow {
          grid-template-columns: 1fr;
        }
        .bubbleWrap {
          max-width: 88%;
        }
      }
      .pmt-launcher-note {
        position: fixed;
        right: 18px;
        bottom: calc(76px + var(--safe-bottom));
        z-index: 999998;
        background: #fff;
        color: var(--pmt-text);
        padding: 10px 16px;
        border-radius: 14px;
        border: 1px solid var(--border-soft);
        box-shadow: var(--shadow-1);
        font-size: 13px;
        font-weight: 600;
        opacity: 0;
        pointer-events: none;
        transform: translateY(10px) scale(0.95);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        transform-origin: bottom right;
        cursor: pointer;
      }
      .pmt-launcher-note.show {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0) scale(1);
      }
      .pmt-launcher-note::after {
        content: "";
        position: absolute;
        bottom: -6px;
        right: 24px;
        width: 10px;
        height: 10px;
        background: #fff;
        border-right: 1px solid var(--border-soft);
        border-bottom: 1px solid var(--border-soft);
        transform: rotate(45deg);
      }
      body.pmt-theme-dark .pmt-launcher-note {
        background: rgba(4, 18, 36, 0.92);
        color: #fff;
        border-color: rgba(255, 255, 255, 0.1);
      }
      .composer {
        padding: 12px 14px 16px 14px;
        border-top: 1px solid var(--border-soft);
        display: flex;
        gap: 10px;
        align-items: flex-end;
        background: var(--pmt-surface);
        z-index: 10;
      }
      .composerMain {
        flex: 1 1 auto;
        display: flex;
        align-items: flex-end;
        gap: 10px;
        border: 1px solid var(--border-soft);
        background: var(--pmt-surface-2);
        border-radius: 20px;
        padding: 8px 14px;
      }
      .composerMain:focus-within {
        border-color: var(--pmt-primary);
        box-shadow: 0 0 0 1px rgba(0, 127, 172, 0.2);
      }
      .composer textarea {
        width: 100%;
        min-height: 26px;
        max-height: 110px;
        resize: none;
        border: none;
        outline: none;
        background: transparent;
        font-size: 13px;
        font-family: var(--font);
        padding: 5px 0;
        margin: 0;
        color: var(--pmt-text);
        line-height: 1.45;
      }
      .composer textarea:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }
      .send {
        width: 44px;
        height: 44px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        background: linear-gradient(
          135deg,
          var(--pmt-accent),
          var(--pmt-primary)
        );
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          transform 0.15s ease,
          opacity 0.15s ease;
        flex: 0 0 auto;
        box-shadow: 0 10px 24px rgba(0, 127, 172, 0.25);
      }
      .send:active {
        transform: scale(0.95);
      }
      .send:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .footerHint {
        font-size: 11px;
        color: var(--pmt-dim);
        text-align: center;
        margin: 0 24px 12px;
      }
      .pmt-screen.home-search-mode {
        display: flex;
        flex-direction: column;
      }
      .googleHomeHero {
        border: 0;
        background: transparent;
        box-shadow: none;
        padding: 34px 16px 10px;
        text-align: center;
      }
      .googleHomeHero .heroBadge {
        margin: 0 auto 12px;
        justify-content: center;
      }
      .googleHomeHero .heroTitle {
        margin: 0 auto 10px;
        font-size: clamp(30px, 5vw, 46px);
        text-align: center;
        letter-spacing: -0.02em;
      }
      .googleHomeHero .heroText {
        margin: 0 auto;
        max-width: 560px;
        text-align: center;
      }
      .googleAskWrap {
        width: 100%;
        max-width: 760px;
        margin: 10px auto 4px;
      }
      .googleAskBox {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 54px;
        border: 1px solid rgba(4, 28, 61, 0.14);
        background: rgba(255, 255, 255, 0.92);
        border-radius: 999px;
        padding: 9px 10px 9px 18px;
        box-shadow: 0 8px 26px rgba(4, 28, 61, 0.07);
        transition:
          box-shadow 0.15s ease,
          border-color 0.15s ease;
      }
      body.pmt-theme-dark .googleAskBox {
        background: rgba(8, 24, 48, 0.78);
        border-color: rgba(148, 180, 214, 0.24);
      }
      .googleAskBox:focus-within {
        border-color: var(--pmt-primary);
        box-shadow: 0 16px 46px rgba(0, 127, 172, 0.2);
      }
      .googleAskBox textarea {
        width: 100%;
        min-height: 28px;
        max-height: 96px;
        resize: none;
        border: none;
        outline: none;
        background: transparent;
        color: var(--pmt-text);
        font-size: 14px;
        line-height: 1.45;
        font-family: var(--font);
        padding: 4px 0;
        margin: 0;
      }
      .googleAskBox textarea::placeholder {
        color: var(--pmt-dim);
      }
      .googleAskSend {
        width: 38px;
        height: 38px;
        border-radius: 999px;
        border: 0;
        background: linear-gradient(
          135deg,
          var(--pmt-accent),
          var(--pmt-primary)
        );
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex: 0 0 auto;
        box-shadow: 0 10px 22px rgba(0, 127, 172, 0.25);
      }
      .googleAskActions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .googleGhostBtn {
        border: 1px solid var(--border-soft);
        background: var(--chip-bg);
        color: var(--pmt-text);
        padding: 10px 14px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        font-family: var(--font);
        cursor: pointer;
      }
      .googleBrowseWrap {
        max-width: 760px;
        width: 100%;
        margin: 16px auto 0;
      }
      .googleBrowseWrap .quickSectionTitle {
        text-align: center;
        margin-bottom: 12px;
      }
      @media (max-width: 520px) {
        .googleAskBox {
          min-height: 50px;
          border-radius: 24px;
        }
      }
      .pmt-nav-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0 2px;
      }
      .pmt-nav-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 7px 14px 7px 10px;
        border-radius: 999px;
        border: 1px solid var(--border-soft);
        background: var(--pmt-surface-2);
        color: var(--pmt-text);
        font-size: 12px;
        font-weight: 700;
        font-family: var(--font);
        cursor: pointer;
        transition:
          background 0.15s ease,
          transform 0.1s ease;
        white-space: nowrap;
      }
      .pmt-nav-btn:hover {
        background: var(--card-hover);
        transform: translateY(-1px);
      }
      .pmt-nav-btn:active {
        transform: scale(0.97);
      }
      .pmt-nav-home {
        margin-left: auto;
      }
      .pmt-q-list {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border-soft);
        border-radius: 18px;
        overflow: hidden;
        background: var(--card-bg);
      }
      .pmt-q-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 13px 14px;
        border: none;
        border-bottom: 1px solid var(--border-soft);
        background: transparent;
        color: var(--pmt-text);
        font-size: 13px;
        font-weight: 500;
        font-family: var(--font);
        text-align: left;
        cursor: pointer;
        transition: background 0.12s ease;
        line-height: 1.4;
      }
      .pmt-q-row:last-child {
        border-bottom: none;
      }
      .pmt-q-row:hover {
        background: var(--card-hover);
      }
      .pmt-q-row:active {
        background: var(--chip-bg);
      }
      .pmt-q-text {
        flex: 1;
      }
      .pmt-q-arrow {
        flex: 0 0 auto;
        color: var(--pmt-dim);
      }
      .pmt-spark-icon {
        width: 72px;
        height: 72px;
        border-radius: 999px;
        display: block;
        margin: 0 auto 14px;
        box-shadow: 0 14px 34px rgba(0, 127, 172, 0.22);
      }
    </style>
  </head>

        };

        let thread = [];

        const storedFullscreen = localStorage.getItem("spark_widget_fullscreen");
        let isFullscreen = storedFullscreen !== null ? storedFullscreen === "true" : true;
        let isMinimized = false;

        // Session-level asked questions tracking
        let askedQuestionsSet = new Set();

        function normalizeQ(str) {
          return String(str || "").toLowerCase().replace(/[^a-z0-9]/g, "").trim();
        }

        const elShell = document.getElementById("pmtShell");
        const elLauncher = document.getElementById("pmtLauncher");

        function createSparkBotSvg(size = 20) {
          const safeSize = Number.isFinite(Number(size)) ? Number(size) : 20;
          return `<img
      src="https://res.cloudinary.com/din7hkzcq/image/upload/v1786026169/Untitled_design_74_jyvfu3.png"
      alt="Spark"
      width="${safeSize}"
      height="${safeSize}"
      style="display:block; width:${safeSize}px; height:${safeSize}px; border-radius:999px; object-fit:cover;"
    />`;
        }

        function escapeHtml(s) {
          return String(s ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }

        function getQuestionsForCategory(key) {
          return CATEGORY_QUESTIONS[key] || [];
        }
        function getCategoryQuestionCount(key) {
          return getQuestionsForCategory(key).length;
        }

        function getRelatedQuestions(userQuery, llmRelatedQuestions = []) {
          const normUserQuery = normalizeQ(userQuery);
          const candidates = [];
          const addedNorms = new Set();

          function addCandidate(q) {
            if (!q || typeof q !== "string") return;
            const trimmed = q.trim();
            const norm = normalizeQ(trimmed);
            if (!norm) return;
            if (askedQuestionsSet.has(norm)) return;
            if (addedNorms.has(norm)) return;
            candidates.push(trimmed);
            addedNorms.add(norm);
          }

          // 1. Add LLM-provided related questions first
          if (Array.isArray(llmRelatedQuestions)) {
            for (const q of llmRelatedQuestions) {
              addCandidate(q);
            }
          }

          // 2. Determine best matching category for userQuery
          let bestCategoryKey = null;
          let highestScore = 0;
          const userWords = userQuery.toLowerCase().split(/\W+/).filter((w) => w.length > 2);

          for (const catKey of Object.keys(CATEGORY_QUESTIONS)) {
            const questions = CATEGORY_QUESTIONS[catKey];
            let score = 0;
            const catObj = CATEGORIES.find((c) => c.key === catKey);
            if (catObj) {
              if (
                userQuery.toLowerCase().includes(catObj.title.toLowerCase()) ||
                userQuery.toLowerCase().includes(catKey.toLowerCase())
              ) {
                score += 5;
              }
            }
            for (const q of questions) {
              const qLower = q.toLowerCase();
              for (const w of userWords) {
                if (qLower.includes(w)) {
                  score += 1;
                }
              }
            }
            if (score > highestScore) {
              highestScore = score;
              bestCategoryKey = catKey;
            }
          }

          if (!bestCategoryKey) {
            bestCategoryKey = "basics";
          }

          // Add questions from best matching category
          if (CATEGORY_QUESTIONS[bestCategoryKey]) {
            for (const q of CATEGORY_QUESTIONS[bestCategoryKey]) {
              addCandidate(q);
            }
          }

          // Top up from all other categories if needed to reach 3
          for (const catKey of Object.keys(CATEGORY_QUESTIONS)) {
            if (candidates.length >= 3) break;
            if (catKey === bestCategoryKey) continue;
            for (const q of CATEGORY_QUESTIONS[catKey]) {
              addCandidate(q);
              if (candidates.length >= 3) break;
            }
          }

          return candidates.slice(0, 3);
        }

                <p class="homeCardSub">${escapeHtml(c.sub)}</p>
                <div class="metaRow" style="margin-top:10px;">
                  <span class="metaTag">${getCategoryQuestionCount(c.key)} questions</span>
                </div>
              </div>
            `,
            ).join("")}
          </div>
        </div>
      </div>`;
          elScreen.scrollTop = 0;
          attachHomePromptEvents();
        }

        function renderCategory(key) {
          const cat = CATEGORIES.find((x) => x.key === key);
          const questions = getQuestionsForCategory(key);
          document.querySelector(".composer").style.display = "none";
          elScreen.classList.remove("home-search-mode");
          elScreen.innerHTML = `
      <div class="thread">
        <div class="pmt-nav-bar">
          <button class="pmt-nav-btn" onclick="window.pmtWidgetActions.renderHome()">← Back</button>
          <button class="pmt-nav-btn pmt-nav-home" onclick="window.pmtWidgetActions.renderHome()">Home</button>
        </div>
        <div class="hero" style="padding:14px 16px;">
          <h1 class="heroTitle" style="font-size:22px; margin-bottom:4px;">${escapeHtml(cat?.title || "Support")}</h1>
          <p class="heroText" style="font-size:13px;">Tap a question or ask your own below.</p>
        </div>
        ${createAskBoxMarkup()}
        <div class="quickSectionTitle">Common questions</div>
        <div class="pmt-q-list">
          ${questions
            .map(
              (q) => `
            <button class="pmt-q-row" onclick="window.pmtWidgetActions.ask(this.dataset.question)" data-question="${escapeHtml(q)}">
              <span class="pmt-q-text">${escapeHtml(q)}</span>
            </button>`,
            )
            .join("")}
        </div>
      </div>`;
          elScreen.scrollTop = 0;
          attachHomePromptEvents();
        }

        function formatMessageText(text) {
          if (!text) return "";
          let clean = escapeHtml(text);
          // Convert Markdown bullet asterisks (* item) at line start to bullet symbol •
          clean = clean.replace(/^[\s]*\*\s+/gm, "• ");
          // Convert Markdown bold **text** to <strong>text</strong>
          clean = clean.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
          // Convert Markdown italic *text* to <em>text</em>
          clean = clean.replace(/\*([^*]+)\*/g, "<em>$1</em>");
          // Convert Markdown links [label](url) into target="_blank" HTML links
          clean = clean.replace(/\[([^\]]+)\]\((https?:\/\/[^\s\)]+)\)/g, (match, label, url) => {
            return `<a href="${url}" target="_blank" rel="noopener" style="color: #00aca0; text-decoration: underline; font-weight: 500;">${label}</a>`;
          });
          // Convert newlines to paragraphs and breaks
          clean = clean.replace(/\n\n+/g, "</p><p>").replace(/\n/g, "<br>");
          return `<p>${clean}</p>`;
        }

        function renderThread() {
          document.querySelector(".composer").style.display = "flex";
          elScreen.classList.remove("home-search-mode");
          elScreen.innerHTML = `
      <div class="thread">
        ${thread
          .map((item, index) => {
            const isLastMessage = index === thread.length - 1;
            return item.role === "user"
              ? `
          <div class="message user">
            <div class="bubbleWrap">
              <div class="bubbleLabel">You</div>
              <div class="bubble richAnswer">${formatMessageText(item.text)}</div>
            </div>
          </div>`
              : `
          <div class="message assistant">
            <div class="avatar">${createSparkBotSvg(22)}</div>
            <div class="bubbleWrap">
              <div class="bubbleLabel">Spark</div>
              <div class="bubble"><div class="richAnswer">${formatMessageText(item.text)}</div></div>
              ${
                !isTyping && isLastMessage && item.relatedQuestions && item.relatedQuestions.length > 0
                  ? `
                <div class="assistantActions" style="flex-direction: column; align-items: flex-start; gap: 6px; margin-top: 10px;">
                  <div style="font-size: 11px; font-weight: 700; color: var(--pmt-dim); padding-left: 2px;">Related questions</div>
                  <div style="display: flex; flex-direction: column; gap: 6px; width: 100%;">
                    ${item.relatedQuestions
                      .map(
                        (rq) => `
                      <button class="microPill" onclick="window.pmtWidgetActions.ask(this.dataset.question)" data-question="${escapeHtml(rq)}">${escapeHtml(rq)}</button>
                    `,
                      )
                      .join("")}
                  </div>
                </div>
              `
                  : ""
              }
            </div>
          </div>`;
          })
          .join("")}
        ${isTyping ? `<div class="message assistant"><div class="avatar">${createSparkBotSvg(22)}</div><div class="bubbleWrap"><div class="bubble">Thinking...</div></div></div>` : ""}
      </div>`;
          elScreen.scrollTop = elScreen.scrollHeight;
        }

        // Manage Session ID
        let sessionId = sessionStorage.getItem("spark_session_id");
        if (!sessionId) {
          sessionId = "spark_" + Math.random().toString(36).substring(2, 11) + "_" + Date.now();
          sessionStorage.setItem("spark_session_id", sessionId);
        }

        async function ask(q) {
          if (!q || !q.trim()) return;
          const userQuery = q.trim();
          askedQuestionsSet.add(normalizeQ(userQuery));
          thread.push({ role: "user", text: userQuery });
          isTyping = true;
          renderThread();

          const webhookUrl = `https://n8n.srv917960.hstgr.cloud/webhook/spark-chatbot?chatInput=${encodeURIComponent(userQuery)}&question=${encodeURIComponent(userQuery)}&sessionId=${encodeURIComponent(sessionId)}`;

          try {
            const response = await fetch(webhookUrl, {
              method: "GET",
              headers: {
                "Accept": "application/json"
              }
            });

            if (!response.ok) {
              throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const data = await response.json();
            let replyText = "";
            let llmRelatedQuestions = [];

            let targetObj = data;
            if (Array.isArray(data) && data.length > 0) {
              targetObj = data[0];
            }

            if (typeof targetObj === "string") {
              try {
                const parsed = JSON.parse(targetObj);
                targetObj = parsed;
              } catch (e) {}
            }

            if (typeof targetObj === "object" && targetObj !== null) {
              replyText = targetObj.text || targetObj.output || targetObj.message || targetObj.response || targetObj.answer || "";
              if (Array.isArray(targetObj.relatedQuestions)) {
                llmRelatedQuestions = targetObj.relatedQuestions;
              } else if (Array.isArray(targetObj.related_questions)) {
                llmRelatedQuestions = targetObj.related_questions;
              } else if (Array.isArray(targetObj.related)) {
                llmRelatedQuestions = targetObj.related;
              }
            } else if (typeof targetObj === "string") {
              replyText = targetObj;
            }

            // Check if replyText is an embedded JSON string containing relatedQuestions
            if (!llmRelatedQuestions.length && typeof replyText === "string") {
              const jsonMatch = replyText.match(/```(?:json)?\s*([\s\S]*?)\s*```/) || replyText.match(/(\{[\s\S]*"relatedQuestions"[\s\S]*\})/i);
              if (jsonMatch) {
                try {
                  const parsed = JSON.parse(jsonMatch[1]);
                  if (parsed.answer || parsed.text || parsed.output) {
                    replyText = parsed.answer || parsed.text || parsed.output;
                  }
                  if (Array.isArray(parsed.relatedQuestions)) {
                    llmRelatedQuestions = parsed.relatedQuestions;
                  }
                } catch (e) {}
              }
            }

            if (!replyText) {
              replyText = typeof data === "string" ? data : "Sorry, I couldn't retrieve an answer at this time.";
            }

            const relatedQs = getRelatedQuestions(userQuery, llmRelatedQuestions);
            thread.push({ role: "assistant", text: replyText, relatedQuestions: relatedQs });
          } catch (error) {
            console.error("Spark Webhook Fetch Error:", error);
            const fallbackAnswer = KB_ANSWERS[userQuery] || "Sorry, I couldn't connect to Spark right now. Please try again or contact support directly at info@paintechnology.com";
            const relatedQs = getRelatedQuestions(userQuery, []);
            thread.push({ role: "assistant", text: fallbackAnswer, relatedQuestions: relatedQs });
          } finally {
            isTyping = false;
            renderThread();
          }
        }

        function submitHomePrompt() {
          const elHome = document.getElementById("homePrompt");
          const val = elHome ? elHome.value : elFreeText.value;
          if (val && val.trim()) {
            if (elHome) elHome.value = "";
            if (elFreeText) elFreeText.value = "";
            ask(val);
          }
        }

        function attachHomePromptEvents() {
          const el = document.getElementById("homePrompt");
          if (!el) return;
          el.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              submitHomePrompt();
            }
          });
        }

        function openWidget() {
          isMinimized = false;
          elShell.classList.remove("minimized");
          const savedFS = localStorage.getItem("spark_widget_fullscreen");
          isFullscreen = savedFS !== null ? savedFS === "true" : true;
          elShell.classList.add("open");
          elShell.classList.toggle("fullscreen", isFullscreen);
          renderHome();
        }
        function closeWidget() {
          elShell.classList.remove("open");
        }

        elLauncher.addEventListener("click", () => {
          if (elShell.classList.contains("open")) closeWidget();
          else openWidget();
        });

        btnClose.addEventListener("click", closeWidget);
        btnResize.addEventListener("click", () => {
          isFullscreen = !isFullscreen;
          elShell.classList.toggle("fullscreen", isFullscreen);
          localStorage.setItem("spark_widget_fullscreen", String(isFullscreen));
        });
        btnMinimize.addEventListener("click", () => {
          isMinimized = !isMinimized;
          elShell.classList.toggle("minimized", isMinimized);
        });
        btnClear.addEventListener("click", () => {
          thread = [];
          askedQuestionsSet.clear();
          sessionId = "spark_" + Math.random().toString(36).substring(2, 11) + "_" + Date.now();
          sessionStorage.setItem("spark_session_id", sessionId);
          renderHome();
        });
        const SVG_SUN = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
        const SVG_MOON = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;

        const savedTheme = localStorage.getItem("spark_widget_theme");
        if (savedTheme === "dark") {
          document.body.classList.add("pmt-theme-dark");
          document.body.classList.remove("pmt-theme-light");
        } else if (savedTheme === "light") {
          document.body.classList.add("pmt-theme-light");
          document.body.classList.remove("pmt-theme-dark");
        }

        function updateThemeIcon() {
          const isDark = document.body.classList.contains("pmt-theme-dark");
          if (btnTheme) btnTheme.innerHTML = isDark ? SVG_SUN : SVG_MOON;
        }

        function toggleTheme() {
          document.body.classList.toggle("pmt-theme-dark");
          document.body.classList.toggle("pmt-theme-light");
          const isDark = document.body.classList.contains("pmt-theme-dark");
          localStorage.setItem("spark_widget_theme", isDark ? "dark" : "light");
          updateThemeIcon();
        }

        if (btnTheme) {
          updateThemeIcon();
          btnTheme.addEventListener("click", toggleTheme);
        }
        btnSend.addEventListener("click", submitHomePrompt);
        elFreeText.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            submitHomePrompt();
          }
        });

        window.pmtWidgetActions = {
          ask,
          renderHome,
          renderCategory,
          submitHomePrompt,
          openContact: () => window.open(`mailto:${CONTACT_EMAIL}`),
          openWarranty: () => window.open(WARRANTY_URL, "_blank"),
          toggleTheme,
        };

        renderHome();
      });
    </script>
  </body>
</html>
