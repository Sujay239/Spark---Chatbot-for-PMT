<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Spark — Smart Pain Assistance and Recovery Knowledge | PMT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --pmt-header-gradient: linear-gradient(
          120deg,
          #00aca0 0%,
          #007fac 55%,
          #041c3d 100%
        );
        --font:
          "Roboto", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        --font-display: "Roboto Condensed", var(--font);
        --pmt-accent: #00aca0;
        --pmt-primary: #007fac;
        --shadow-1: 0 10px 30px rgba(0, 0, 0, 0.18);
        --shadow-2: 0 24px 80px rgba(2, 6, 23, 0.28);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      :root {
        --pmt-bg: #ffffff;
        --pmt-surface: rgba(255, 255, 255, 0.94);
        --pmt-surface-2: rgba(4, 28, 61, 0.03);
        --pmt-text: #041c3d;
        --pmt-muted: rgba(4, 28, 61, 0.72);
        --pmt-dim: rgba(4, 28, 61, 0.56);
        --border-soft: rgba(4, 28, 61, 0.08);
        --input-bg: rgba(255, 255, 255, 0.98);
        --input-border: rgba(4, 28, 61, 0.12);
        --input-focus: rgba(0, 172, 160, 0.28);
        --chip-bg: rgba(4, 28, 61, 0.03);
        --card-bg: rgba(4, 28, 61, 0.025);
        --card-hover: rgba(4, 28, 61, 0.05);
        --assistant-bubble: rgba(4, 28, 61, 0.04);
        --user-bubble: linear-gradient(135deg, #00aca0, #007fac);
        --success-bg: rgba(34, 197, 94, 0.08);
        --warning-bg: rgba(245, 158, 11, 0.1);
      }
      body.pmt-theme-dark {
        --pmt-bg: #041224;
        --pmt-surface: rgba(8, 24, 48, 0.78);
        --pmt-surface-2: rgba(255, 255, 255, 0.03);
        --pmt-text: #f3f6fb;
        --pmt-muted: rgba(226, 234, 245, 0.78);
        --pmt-dim: rgba(226, 234, 245, 0.54);
        --border-soft: rgba(255, 255, 255, 0.08);
        --input-bg: rgba(8, 24, 48, 0.88);
        --input-border: rgba(148, 180, 214, 0.28);
        --input-focus: rgba(0, 172, 160, 0.3);
        --chip-bg: rgba(255, 255, 255, 0.04);
        --card-bg: rgba(255, 255, 255, 0.03);
        --card-hover: rgba(255, 255, 255, 0.06);
        --assistant-bubble: rgba(255, 255, 255, 0.04);
        --success-bg: rgba(34, 197, 94, 0.12);
        --warning-bg: rgba(245, 158, 11, 0.14);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--font);
        background: transparent;
        color: var(--pmt-text);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .pmt-launcher {
        position: fixed;
        right: 18px;
        bottom: calc(18px + var(--safe-bottom));
        z-index: 999999;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px 12px 12px;
        border-radius: 999px;
        border: 1px solid rgba(4, 28, 61, 0.08);
        background: rgba(255, 255, 255, 0.94);
        box-shadow: var(--shadow-1);
        color: #041c3d;
        cursor: pointer;
        user-select: none;
        backdrop-filter: blur(14px);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          background 0.15s ease;
      }
      body.pmt-theme-dark .pmt-launcher {
        border-color: rgba(255, 255, 255, 0.1);
        background: rgba(4, 18, 36, 0.86);
        color: #fff;
      }
      .pmt-launcher:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.22);
      }
      .pmt-launcher:active {
        transform: scale(0.99);
      }
      .pmt-launcher .label {
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.1px;
        white-space: nowrap;
        font-family: var(--font-display);
      }
      .pmt-shell {
        position: fixed;
        right: 18px;
        bottom: calc(78px + var(--safe-bottom));
        z-index: 999999;
        width: 430px;
        max-width: calc(100vw - 36px);
        height: min(82dvh, 760px);
        min-height: 600px;
        min-width: 340px;
        max-height: 95dvh;
        background: var(--pmt-surface);
        border: 1px solid var(--border-soft);
        border-radius: 24px;
        box-shadow: var(--shadow-2);
        overflow: hidden;
        display: none;
        backdrop-filter: blur(20px);
        container-type: inline-size;
      }
      .pmt-shell.open {
        display: block !important;
      }
      .pmt-shell.fullscreen {
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100vw !important;
        height: 100dvh !important;
        max-width: none !important;
        max-height: none !important;
        border-radius: 0;
        min-width: 100vw;
        min-height: 100dvh;
      }
      .pmt-shell.minimized {
        height: 72px !important;
        min-height: 72px !important;
        width: 360px;
        overflow: hidden;
      }
      .pmt-shell.minimized .pmt-body {
        display: none;
      }
      .pmt-shell.minimized .pmt-topbar {
        min-height: 72px;
      }
      .pmt-topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 10px 10px 16px;
        background: var(--pmt-header-gradient);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        min-height: 70px;
      }
      .pmt-topbar-left {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
      }
      .pmt-logo {
        height: 40px;
        width: auto;
        object-fit: contain;
        display: block;
      }
      .pmt-beta-badge {
        font-size: 8px;
        font-weight: 700;
        text-transform: uppercase;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.2),
          rgba(255, 255, 255, 0.05)
        );
        color: #fff;
        padding: 2px 6px;
        border-radius: 100px;
        letter-spacing: 0.5px;
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        display: inline-flex;
        align-items: center;
        height: fit-content;
        margin-left: 0;
        user-select: none;
        flex-shrink: 0;
      }
      .pmt-topbar-right {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
        margin-left: auto;
      }
      .btn-primary,
      .btn-secondary,
      .btn-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        font-weight: 700;
        cursor: pointer;
        border: none;
        background: none;
        font-family: var(--font);
        transition:
          transform 0.15s ease,
          opacity 0.15s ease,
          background 0.15s ease;
        user-select: none;
        text-decoration: none;
      }
      .btn-primary {
        background: linear-gradient(
          135deg,
          var(--pmt-accent),
          var(--pmt-primary)
        );
        color: #fff;
        box-shadow: 0 10px 24px rgba(0, 127, 172, 0.25);
        padding: 10px 14px;
        font-size: 13px;
        white-space: nowrap;
      }
      .btn-secondary {
        color: var(--pmt-text);
        background: var(--chip-bg);
        border: 1px solid var(--border-soft);
        padding: 10px 14px;
        font-size: 13px;
        white-space: nowrap;
      }
      .btn-icon {
        width: 32px;
        height: 32px;
        border: 1px solid rgba(226, 232, 240, 0.22);
        background: rgba(4, 28, 61, 0.18);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
      }
      .btn-primary:active,
      .btn-secondary:active,
      .btn-icon:active {
        transform: scale(0.98);
      }
      .pmt-body {
        height: calc(100% - 70px);
        display: flex;
        flex-direction: column;
        background: var(--pmt-bg);
      }
      body.pmt-theme-dark .pmt-body {
        background: radial-gradient(
          circle at top,
          rgba(8, 24, 48, 0.92),
          #041224 70%
        );
      }
      .pmt-screen {
        padding: 18px 16px 16px;
        overflow: auto;
        flex: 1 1 auto;
        scroll-behavior: smooth;
      }
      .thread {
        display: flex;
        flex-direction: column;
        gap: 12px;
        animation: pmtFadeIn 0.22s ease-out;
      }
      @keyframes pmtFadeIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .hero {
        border: 1px solid var(--border-soft);
        background: var(--pmt-surface-2);
        border-radius: 22px;
        padding: 18px 16px;
        box-shadow: 0 10px 24px rgba(4, 28, 61, 0.06);
      }
      .heroBadge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--chip-bg);
        border: 1px solid var(--border-soft);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--pmt-dim);
        margin-bottom: 14px;
      }
      .heroTitle {
        margin: 0 0 8px;
        font-family: var(--font-display);
        font-size: 28px;
        line-height: 1.05;
        letter-spacing: -0.01em;
        font-weight: 700;
        color: var(--pmt-text);
      }
      .heroText {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--pmt-muted);
        max-width: 34ch;
      }
      .quickSectionTitle {
        margin: 6px 2px 2px;
        color: var(--pmt-dim);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-weight: 600;
      }
      .chip {
        border: 1px solid var(--border-soft);
        background: transparent;
        color: var(--pmt-text);
        padding: 10px 14px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        font-family: var(--font);
        transition:
          background 0.15s ease,
          transform 0.15s ease;
        text-align: left;
        white-space: normal;
        line-height: 1.3;
      }
      .chip:hover {
        background: var(--card-hover);
        transform: translateY(-1px);
      }
      .cardRow {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .homeCard {
        border: 1px solid var(--border-soft);
        border-radius: 18px;
        background: var(--card-bg);
        padding: 14px;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          background 0.15s ease;
      }
      .homeCard:hover {
        background: var(--card-hover);
        transform: translateY(-1px);
      }
      .homeCardTitle {
        margin: 0 0 4px;
        font-size: 13px;
        font-weight: 700;
        color: var(--pmt-text);
        font-family: var(--font-display);
      }
      .homeCardSub {
        margin: 0;
        font-size: 12px;
        line-height: 1.35;
        color: var(--pmt-muted);
      }
      .ctaPanel {
        border: 1px solid var(--border-soft);
        border-radius: 18px;
        padding: 14px;
        background: linear-gradient(180deg, var(--success-bg), transparent);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .ctaPanelTitle {
        margin: 0 0 4px;
        font-size: 13px;
        font-weight: 700;
        color: var(--pmt-text);
      }
      .ctaPanelText {
        margin: 0;
        font-size: 12px;
        line-height: 1.4;
        color: var(--pmt-muted);
      }
      .message {
        display: flex;
        width: 100%;
        gap: 10px;
        animation: pmtFadeIn 0.18s ease-out;
      }
      .message.assistant {
        justify-content: flex-start;
      }
      .message.user {
        justify-content: flex-end;
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          135deg,
          var(--pmt-accent),
          var(--pmt-primary)
        );
        box-shadow: 0 8px 20px rgba(0, 127, 172, 0.28);
        margin-top: 2px;
        overflow: hidden;
      }
      .avatar img {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover;
        border-radius: 999px;
      }
      .bubbleWrap {
        max-width: min(84%, 320px);
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .pmt-shell.fullscreen .bubbleWrap {
        max-width: min(84%, 800px);
      }
      .message.user .bubbleWrap {
        align-items: flex-end;
      }
      .bubbleLabel {
        font-size: 11px;
        color: var(--pmt-dim);
        font-weight: 700;
        padding: 0 2px;
      }
      .bubble {
        border-radius: 18px;
        padding: 13px 14px;
        border: 1px solid var(--border-soft);
        background: var(--assistant-bubble);
        color: var(--pmt-text);
        line-height: 1.55;
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .message.user .bubble {
        background: var(--user-bubble);
        color: #fff;
        border-color: transparent;
        box-shadow: 0 10px 28px rgba(0, 127, 172, 0.25);
      }
      .assistantActions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .microPill {
        border-radius: 999px;
        padding: 8px 11px;
        border: 1px solid var(--border-soft);
        background: var(--chip-bg);
        color: var(--pmt-text);
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        font-family: var(--font);
        text-align: left;
        white-space: normal;
        line-height: 1.3;
      }
      .microPill:hover {
        background: var(--card-hover);
      }
      .typingBubble {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 18px;
      }
      .typingBubble span {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--pmt-dim);
        display: block;
        animation: pmtBlink 1.2s infinite ease-in-out;
      }
      .typingBubble span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .typingBubble span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes pmtBlink {
        0%,
        80%,
        100% {
          opacity: 0.35;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-1px);
        }
      }
      .richAnswer p {
        margin: 0 0 10px;
      }
      .richAnswer p:last-child {
        margin-bottom: 0;
      }
      .richAnswer ul,
      .richAnswer ol {
        margin: 0 0 10px 18px;
        padding: 0;
      }
      .richAnswer li {
        margin: 0 0 6px;
      }
      .richAnswer strong {
        font-weight: 700;
        color: var(--pmt-text);
      }
      .message.user .richAnswer strong {
        color: #fff;
      }
      .richAnswer .callout {
        display: block;
        margin: 10px 0;
        padding: 10px 11px;
        border-radius: 14px;
        background: var(--warning-bg);
        border: 1px solid var(--border-soft);
        font-size: 12px;
      }
      .metaRow {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 6px;
      }
      .metaTag {
        font-size: 11px;
        font-weight: 700;
        color: var(--pmt-dim);
        background: var(--chip-bg);
        border: 1px solid var(--border-soft);
        border-radius: 999px;
        padding: 6px 10px;
      }
      .stuckCard {
        margin-top: 2px;
        border: 1px solid var(--border-soft);
        background: var(--pmt-surface-2);
        border-radius: 18px;
        padding: 14px;
      }
      .stuckTitle {
        margin: 0 0 5px;
        font-size: 13px;
        font-weight: 700;
        color: var(--pmt-text);
      }
      .stuckText {
        margin: 0 0 10px;
        font-size: 12px;
        line-height: 1.4;
        color: var(--pmt-muted);
      }
      @container (max-width: 480px) {
        .support-btn-text {
          display: none !important;
        }
      }
      @media (max-width: 600px) {
        .support-btn-text {
          display: none;
        }
        .pmt-topbar {
          padding: 8px 10px;
          min-height: 56px;
        }
        .pmt-logo {
          height: 32px;
        }
        .pmt-topbar-left {
          gap: 6px;
        }
        .pmt-topbar-right {
          gap: 2px;
        }
        .btn-icon {
          width: 28px;
          height: 28px;
          font-size: 13px;
        }
        #btnResize {
          display: none !important;
        }
        .pmt-shell:not(.minimized) {
          top: 0 !important;
          left: 0 !important;
          right: 0 !important;
          bottom: 0 !important;
          width: 100vw !important;
          height: 100dvh !important;
          max-width: none !important;
          max-height: none !important;
          border-radius: 0 !important;
          min-width: 100vw !important;
          min-height: 100dvh !important;
        }
        .pmt-shell.minimized {
          right: 12px !important;
          left: 12px !important;
          bottom: calc(18px + var(--safe-bottom)) !important;
          width: calc(100vw - 24px) !important;
        }
        .heroTitle {
          font-size: 26px;
        }
        .cardRow {
          grid-template-columns: 1fr;
        }
        .bubbleWrap {
          max-width: 88%;
        }
      }
      .pmt-launcher-note {
        position: fixed;
        right: 18px;
        bottom: calc(76px + var(--safe-bottom));
        z-index: 999998;
        background: #fff;
        color: var(--pmt-text);
        padding: 10px 16px;
        border-radius: 14px;
        border: 1px solid var(--border-soft);
        box-shadow: var(--shadow-1);
        font-size: 13px;
        font-weight: 600;
        opacity: 0;
        pointer-events: none;
        transform: translateY(10px) scale(0.95);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        transform-origin: bottom right;
        cursor: pointer;
      }
      .pmt-launcher-note.show {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0) scale(1);
      }
      .pmt-launcher-note::after {
        content: "";
        position: absolute;
        bottom: -6px;
        right: 24px;
        width: 10px;
        height: 10px;
        background: #fff;
        border-right: 1px solid var(--border-soft);
        border-bottom: 1px solid var(--border-soft);
        transform: rotate(45deg);
      }
      body.pmt-theme-dark .pmt-launcher-note {
        background: rgba(4, 18, 36, 0.92);
        color: #fff;
        border-color: rgba(255, 255, 255, 0.1);
      }
      .composer {
        padding: 12px 14px 16px 14px;
        border-top: 1px solid var(--border-soft);
        display: flex;
        gap: 10px;
        align-items: flex-end;
        background: var(--pmt-surface);
        z-index: 10;
      }
      .composerMain {
        flex: 1 1 auto;
        display: flex;
        align-items: flex-end;
        gap: 10px;
        border: 1px solid var(--border-soft);
        background: var(--pmt-surface-2);
        border-radius: 20px;
        padding: 8px 14px;
      }
      .composerMain:focus-within {
        border-color: var(--pmt-primary);
        box-shadow: 0 0 0 1px rgba(0, 127, 172, 0.2);
      }
      .composer textarea {
        width: 100%;
        min-height: 26px;
        max-height: 110px;
        resize: none;
        border: none;
        outline: none;
        background: transparent;
        font-size: 13px;
        font-family: var(--font);
        padding: 5px 0;
        margin: 0;
        color: var(--pmt-text);
        line-height: 1.45;
      }
      .composer textarea:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }
      .send {
        width: 44px;
        height: 44px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        background: linear-gradient(
          135deg,
          var(--pmt-accent),
          var(--pmt-primary)
        );
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          transform 0.15s ease,
          opacity 0.15s ease;
        flex: 0 0 auto;
        box-shadow: 0 10px 24px rgba(0, 127, 172, 0.25);
      }
      .send:active {
        transform: scale(0.95);
      }
      .send:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .footerHint {
        font-size: 11px;
        color: var(--pmt-dim);
        text-align: center;
        margin: 0 24px 12px;
      }
      .pmt-screen.home-search-mode {
        display: flex;
        flex-direction: column;
      }
      .googleHomeHero {
        border: 0;
        background: transparent;
        box-shadow: none;
        padding: 34px 16px 10px;
        text-align: center;
      }
      .googleHomeHero .heroBadge {
        margin: 0 auto 12px;
        justify-content: center;
      }
      .googleHomeHero .heroTitle {
        margin: 0 auto 10px;
        font-size: clamp(30px, 5vw, 46px);
        text-align: center;
        letter-spacing: -0.02em;
      }
      .googleHomeHero .heroText {
        margin: 0 auto;
        max-width: 560px;
        text-align: center;
      }
      .googleAskWrap {
        width: 100%;
        max-width: 760px;
        margin: 10px auto 4px;
      }
      .googleAskBox {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 54px;
        border: 1px solid rgba(4, 28, 61, 0.14);
        background: rgba(255, 255, 255, 0.92);
        border-radius: 999px;
        padding: 9px 10px 9px 18px;
        box-shadow: 0 8px 26px rgba(4, 28, 61, 0.07);
        transition:
          box-shadow 0.15s ease,
          border-color 0.15s ease;
      }
      body.pmt-theme-dark .googleAskBox {
        background: rgba(8, 24, 48, 0.78);
        border-color: rgba(148, 180, 214, 0.24);
      }
      .googleAskBox:focus-within {
        border-color: var(--pmt-primary);
        box-shadow: 0 16px 46px rgba(0, 127, 172, 0.2);
      }
      .googleAskBox textarea {
        width: 100%;
        min-height: 28px;
        max-height: 96px;
        resize: none;
        border: none;
        outline: none;
        background: transparent;
        color: var(--pmt-text);
        font-size: 14px;
        line-height: 1.45;
        font-family: var(--font);
        padding: 4px 0;
        margin: 0;
      }
      .googleAskBox textarea::placeholder {
        color: var(--pmt-dim);
      }
      .googleAskSend {
        width: 38px;
        height: 38px;
        border-radius: 999px;
        border: 0;
        background: linear-gradient(
          135deg,
          var(--pmt-accent),
          var(--pmt-primary)
        );
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex: 0 0 auto;
        box-shadow: 0 10px 22px rgba(0, 127, 172, 0.25);
      }
      .googleAskActions {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .googleGhostBtn {
        border: 1px solid var(--border-soft);
        background: var(--chip-bg);
        color: var(--pmt-text);
        padding: 10px 14px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        font-family: var(--font);
        cursor: pointer;
      }
      .googleBrowseWrap {
        max-width: 760px;
        width: 100%;
        margin: 16px auto 0;
      }
      .googleBrowseWrap .quickSectionTitle {
        text-align: center;
        margin-bottom: 12px;
      }
      @media (max-width: 520px) {
        .googleAskBox {
          min-height: 50px;
          border-radius: 24px;
        }
      }
      .pmt-nav-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0 2px;
      }
      .pmt-nav-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 7px 14px 7px 10px;
        border-radius: 999px;
        border: 1px solid var(--border-soft);
        background: var(--pmt-surface-2);
        color: var(--pmt-text);
        font-size: 12px;
        font-weight: 700;
        font-family: var(--font);
        cursor: pointer;
        transition:
          background 0.15s ease,
          transform 0.1s ease;
        white-space: nowrap;
      }
      .pmt-nav-btn:hover {
        background: var(--card-hover);
        transform: translateY(-1px);
      }
      .pmt-nav-btn:active {
        transform: scale(0.97);
      }
      .pmt-nav-home {
        margin-left: auto;
      }
      .pmt-q-list {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border-soft);
        border-radius: 18px;
        overflow: hidden;
        background: var(--card-bg);
      }
      .pmt-q-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 13px 14px;
        border: none;
        border-bottom: 1px solid var(--border-soft);
        background: transparent;
        color: var(--pmt-text);
        font-size: 13px;
        font-weight: 500;
        font-family: var(--font);
        text-align: left;
        cursor: pointer;
        transition: background 0.12s ease;
        line-height: 1.4;
      }
      .pmt-q-row:last-child {
        border-bottom: none;
      }
      .pmt-q-row:hover {
        background: var(--card-hover);
      }
      .pmt-q-row:active {
        background: var(--chip-bg);
      }
      .pmt-q-text {
        flex: 1;
      }
      .pmt-q-arrow {
        flex: 0 0 auto;
        color: var(--pmt-dim);
      }
      .pmt-spark-icon {
        width: 72px;
        height: 72px;
        border-radius: 999px;
        display: block;
        margin: 0 auto 14px;
        box-shadow: 0 14px 34px rgba(0, 127, 172, 0.22);
      }
      /* ── Contact Form Modal ── */
      .pmt-contact-overlay {
        position: absolute;
        inset: 0;
        z-index: 100;
        background: rgba(4, 28, 61, 0.45);
        backdrop-filter: blur(6px);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        animation: pmtFadeIn 0.2s ease-out;
      }
      .pmt-contact-overlay.open { display: flex; }
      .pmt-contact-card {
        width: 100%;
        max-width: 400px;
        max-height: calc(100% - 24px);
        overflow-y: auto;
        background: var(--pmt-surface);
        border: 1px solid var(--border-soft);
        border-radius: 22px;
        padding: 24px 20px 20px;
        box-shadow: var(--shadow-2);
      }
      .pmt-contact-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
      }
      .pmt-contact-header h2 {
        margin: 0;
        font-family: var(--font-display);
        font-size: 20px;
        font-weight: 700;
        color: var(--pmt-text);
      }
      .pmt-contact-close {
        width: 30px; height: 30px;
        border-radius: 999px;
        border: 1px solid var(--border-soft);
        background: var(--chip-bg);
        color: var(--pmt-text);
        font-size: 16px; font-weight: 700;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: background 0.15s ease;
      }
      .pmt-contact-close:hover { background: var(--card-hover); }
      .pmt-contact-form { display: flex; flex-direction: column; gap: 14px; }
      .pmt-form-row { display: flex; gap: 10px; }
      .pmt-form-row > .pmt-form-group { flex: 1; }
      .pmt-form-group { display: flex; flex-direction: column; gap: 4px; }
      .pmt-form-group label {
        font-size: 12px; font-weight: 700;
        color: var(--pmt-dim);
        letter-spacing: 0.02em;
      }
      .pmt-form-group input,
      .pmt-form-group textarea {
        width: 100%;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--input-border);
        background: var(--input-bg);
        color: var(--pmt-text);
        font-size: 13px;
        font-family: var(--font);
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .pmt-form-group textarea {
        min-height: 80px;
        resize: vertical;
      }
      .pmt-form-group input:focus,
      .pmt-form-group textarea:focus {
        border-color: var(--pmt-primary);
        box-shadow: 0 0 0 3px var(--input-focus);
      }
      .pmt-form-group input.pmt-invalid,
      .pmt-form-group textarea.pmt-invalid {
        border-color: #e74c3c;
        box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.15);
      }
      .pmt-form-error {
        font-size: 11px;
        color: #e74c3c;
        min-height: 14px;
        line-height: 1.3;
      }
      .pmt-contact-submit {
        width: 100%;
        padding: 12px;
        border-radius: 14px;
        border: none;
        background: linear-gradient(135deg, var(--pmt-accent), var(--pmt-primary));
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        font-family: var(--font-display);
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(0, 127, 172, 0.25);
        transition: transform 0.15s ease, opacity 0.15s ease;
      }
      .pmt-contact-submit:active { transform: scale(0.98); }
      .pmt-contact-submit:disabled {
        opacity: 0.6; cursor: not-allowed;
      }
      .pmt-contact-success {
        text-align: center;
        padding: 28px 10px;
      }
      .pmt-contact-success .pmt-success-icon {
        width: 56px; height: 56px;
        border-radius: 999px;
        background: var(--success-bg);
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 14px;
        font-size: 28px;
      }
      .pmt-contact-success h3 {
        margin: 0 0 6px;
        font-family: var(--font-display);
        font-size: 18px;
        color: var(--pmt-text);
      }
      .pmt-contact-success p {
        margin: 0;
        font-size: 13px;
        color: var(--pmt-muted);
        line-height: 1.5;
      }
    </style>
  </head>

            <h2>Talk to a Human</h2>
            <button class="pmt-contact-close" id="pmtContactClose" title="Close">✕</button>

          <form class="pmt-contact-form" id="pmtContactForm" novalidate>
            <div class="pmt-form-row">
              <div class="pmt-form-group">
                <label for="pmtFirstName">First Name</label>
                <input type="text" id="pmtFirstName" placeholder="John" autocomplete="given-name" />
                <span class="pmt-form-error" id="errFirstName"></span>
              </div>
              <div class="pmt-form-group">
                <label for="pmtLastName">Last Name</label>
                <input type="text" id="pmtLastName" placeholder="Doe" autocomplete="family-name" />
                <span class="pmt-form-error" id="errLastName"></span>
              </div>
            </div>
            <div class="pmt-form-group">
              <label for="pmtEmail">Email</label>
              <input type="email" id="pmtEmail" placeholder="john@example.com" autocomplete="email" />
              <span class="pmt-form-error" id="errEmail"></span>
            </div>
            <div class="pmt-form-group">
              <label for="pmtPhone">Phone Number</label>
              <input type="tel" id="pmtPhone" placeholder="(555) 123-4567" autocomplete="tel" />
              <span class="pmt-form-error" id="errPhone"></span>
            </div>
            <div class="pmt-form-group">
              <label for="pmtMessage">Message</label>
              <textarea id="pmtMessage" rows="3" placeholder="How can we help you?"></textarea>
              <span class="pmt-form-error" id="errMessage"></span>
            </div>
            <button type="submit" class="pmt-contact-submit" id="pmtContactSubmit">Submit</button>
          </form>
        </div>

          "How does a TENS unit work?":
            "A Transcutaneous Electrical Nerve Stimulation (TENS) unit is a small, battery-powered device that helps relieve pain by sending low-voltage electrical pulses through electrode pads placed on the skin. These gentle electrical impulses stimulate the nerves beneath the skin and can help reduce the way your body perceives pain.",
          "What does a TENS unit feel like?":

          "What does a TENS unit actually do?":

          "Can I place the pads directly over where the pain is?":

          "Can I use more than one channel at a time?":

          "Which mode should I use?":

          "What frequency is best for chronic pain?":
            "For chronic pain, many TENS users find relief within lower frequencies (around 1-10 Hz), which may encourage the release of natural pain-relieving chemicals like endorphins. Some users also benefit from higher frequencies (around 50-120Hz), which may help block pain signals and provide more immediate relief.",
          "What frequency works best for acute pain?":

          "How high should I turn up the intensity?":

          "Should the stimulation feel strong or gentle?":

          "Why does the sensation fade after a few minutes?":

          "What pain conditions does TENS help with?":

          "Is it safe to use a TENS unit while sleeping?":

          "Can I wear a TENS unit all day?":

          "Can I use TENS with a pacemaker?":

          "Is a TENS unit safe to use during pregnancy?":

          "Can I use a TENS unit if I have diabetes?":

          "Can I use a TENS unit if I have metal implants?":
            "In many cases, yes, TENS can be used with metal implants, such as joint replacements or surgical hardware. The electrical stimulation from a TENS unit typically does not affect non-electronic metal implants. However, you should check with your healthcare provider before use, especially if the implant is near the treatment area or if you have any type of electronic implant (such as a pacemaker, defibrillator, or nerve stimulator).",
          "Where should I never place TENS pads?":
            "TENS pads should never be placed on certain areas where stimulation could be unsafe, including: front or sides of neck (near the throat or carotid arteries). Across the chest or directly over the heart. On the head, face, or near the eyes. Inside the mouth or on broken skin. Over open wounds, sores, infections, or irritated skin. Directly over the spine or major bony areas. Across the abdomen or lower back during pregnancy UNLESS approved by a healthcare provider. Near implanted electronic devices (such as pacemakers or defibrillators).",
          "Can I drive while using a TENS unit?":

          "How long do TENS pads last?":
            "TENS electrodes typically last 10-30 uses,depending on the quality of the pads, how often they are used, skin condition, and how well they are cared for. To help extend the lifespan of an electrode: Apply pads to clean, dry skin. Store them properly on the provided backing sheet. Avoid using lotions or oils before application. Replace pads when they lose stickiness or stimulation becomes uneven.",
          "Why won't my pads stick anymore?":
            "TENS pads can lose their stickiness over time due to repeated use, moisture, oils, lotions, dirt, or improper storage. As the gel dries out or the pads are used, the pads may not make proper contact with the skin, which will reduce stimulation quality. Once you are noticing that your pads are sticking less, or are starting to fall off the skin, it is recommended to swap out your pads for new. To improve pad life: Clean and dry your skin before applying pads. Avoid using lotions, oils, or creams before treatment. Store pads on their backing sheet in a sealed bag or container. Replace pads when the gel becomes dry, dirty, or no longer adheres well.",
          "How do I make my pads sticky again?":

          "Can I wash or clean electrode pads?":

          "Are generic pads compatible with my unit?":

          "What pads are compatible with my unit?":

          "What's the difference between 2 inch and 4 inch pads?":

          "How do I know which pads are best for me?":

          "Why isn't my TENS unit producing sensation?":
            "If you don't feel any simulation from your TENS unit, check these common causes; Intensity is too low: Gradually increase the intensity until you feel a comfortable tingling or pulsing sensation. Pads are not making good contact: Make sure pads are fully attached to clean, dry skin. Electrodes are worn out: Old or dry pads may not transfer stimulation properly. Pad placement needs adjustment: Try moving the pads closer to the area of treatment or adjusting their postion. Cable or connection issue: Make sure the leads are securely connected to both the unit and the pads. Low Battery: Replace or recharge the battery if the device is not powering correctly.",
          "Why is only one pad working?":
            "If only one pad seems to be producing a sensation, the issue is usually related to pad contact, connections, or the electrode itself. Try these steps: Check the pad connection: Make sure both lead wires are firmly connected to the TENS unit and electrode pads. Test the pads: Swap the pads or cables to see if the issue follows the pad or the channel. Replace the pad: A worn or dried-out electrode may not conduct properly. Improve the skin contact: Clean and dry the skin, then reapply the pads firmly. Check the channel settings: Make sure both channels are turned on if your unit has multiple channels.",
          "Why does the stimulation feel sharp instead of comfortable?":

          "Why does my skin turn red after treatment?":
            "Mild redness after using a TENS unit can be normal and is often caused by increased circulation, pressure from the electrode, or mild skin sensitivity. It should typically fade shortly after removing the pads. To reduce skin irritation: Make sure your skin is clean and dry before use. Avoid placing pads on irritated or damaged skin. Rotate pad placement between treatments. Reduce treatment intensity if the sensation feels uncomfortable. Replace electrodes when the gel becomes old or irritating.",
          "Why does my unit keep turning off?":
            "If your TENS unit keeps shutting off, it is usually caused by a power, connection, or safety feature issue. Common issues include: Low battery: Replace or recharge the batteries to ensure the unit has enough power. Automatic Shutoff Timer: Many TENS units turn off automatically after a set treatment time. Loose connections: Check that the lead wires are fully connected to the unit and electrode pads. Poor pad contact: If the pads lose contact with the skin, some units may pause or stop stimulation. Damaged cables or electrodes: Worn pads or faulty wires can interrupt the connection. Intensity set too high: Some devices may stop if they detect an issue with the electrical connection.",
          "Why does the intensity suddenly decrease?":
            "A sudden drop in intensity is usually caused by changes in pad contact, skin resistance, or the unit's built-in adjustments. Common causes include: Your body adapting to the stimulation: Nerve can become less sensitive to the sensation over time. Pads losting contact: Sweat, movement, or worn adhesive can reduce conductivity. Automatic modulation: Some TENS modes adjust the stimulation level or pattern to keep the sensation comfortable. Low battery: Reduced power can affect stimulation strength. Loose connections: Check that the lead wires and pads are securely attached.",
          "How long does the battery last?":

          "Should I buy a rechargable batteries?":

          "What's the difference between TENS and EMS?":

          "Can one device do both TENS and EMS?":

          "Does TENS actually work?":

          "Is pain relief immediate or temporary?":

          "Will my body get used to TENS?":
            "Yes, your body can adapt to TENS stimulation over time, which may make the sensation feel less noticeable. This a normal response called habituation. To help maintain effectiveness: Increase the intensity slightly as needed (while keeping it comfortable), Adjust pad placement between sessions, Use different modes or settings if your device offers them, Avoid using the same exact settings every time.",
          "Can TENS help me avoid pain medication?":

          "Can TENS speed up healing or does it only mask pain?":
            "TENS is primarily used for pain relief, not to directly heal injuries. It helps by changing how pain signals are processed by the nervous system, which can make discomfort more manageable. By reducing pain, TENS may help some people move more comfortable, particupate in physical therapy, and stay active, which can support the overall recovery process. However, it does not repair damaged tissue or speed up healing on its own.",
          "What TENS unit is best for home use?":
            "The best TENS unit for home use depends on your needs, but a good home unit should have: Adjustable intensity levels, multiple modes, dual channels, rechargable batteries, easy controls and a clear display. For most home users, a reliable dual channel TENS unit with adjustable programs is a good choice because it offers flexibility for areas like the back, neck, shoulders, knees, and joints.",
          "Is a prescription required?":

          "What accessories should I buy with a TENS unit?":
            "The most useful accessories depend on how often you use your TENS unit, but these are the most common add-ons: Extra electrode pads, Different Pad Sizes, Replacement Lead Wires, Carrying Case, Rechargable batteries or charging cable, Electrode storage bag or container.",
          "What program should I use for my condition?":
            "The best TENS program depends on your type of pain, where it is located, and how your body responds to stimulation. There is no single setting that works best for everyone. Start with a comfortable setting and adjust based on how your body responds.",
          "How many minutes should I do per session?":
            "Most TENS sessions typically last 15-60 minutes, depending on your comfort level, the device settings, and your specific needs. General guidelines: Start with 15-30 minutes to see how your body responds. Common session lengths: 30-60 minutes. Repeat Sessions: Many people use TENS multiple times throughout the day if needed, allowing breaks between treatments. Avoid using TENS for extended periods without breaks, and always follow your device's instructions.",
          "Can I use TENS more than once a day?":

          "When should I replace the pads?":
            "Replace your TENS pads when they no longer provide good skin contact or consistent stimulation. Signs it's time for new pads: They stop sticking well to your skin. The edges begin to lift or curl. Stimulation feels uneven, weak, or uncomfortable. The gel looks dry, dirty, or damaged. Skin irritation occurs after use. With proper care, reusable electrode pads typically last 10-30 uses, but lifespan varies based on skin type, storage, and frequency of use.",
          "How do I clean and store the unit?":

          "How do I maximize pain relief?":

          "What are the theories behind how TENS units work?":
            'There are two leading theories that explain why TENS provides relief, and understanding them can help you get more out of your device. The first is the Gate Control Theory of Pain. It suggests that the electrical pulses from your TENS unit travel along nerve fibers faster than pain signals do, effectively closing a "gate" in your spinal cord so fewer pain signals reach your brain. This is generally associated with higher frequency settings and tends to provide faster, more immediate relief. The second is the Endorphin Release Theory, which suggests that certain settings, typically lower frequencies, encourage your body to release endorphins, its own natural pain-relieving chemicals. This effect tends to build more gradually and can last longer after your session ends. Many people find that combining both approaches, or simply experimenting with frequency over a few sessions, helps them find what works best for their body.',
          "How should I approach electrode placement?":
            "Proper electrode placement can make a big difference in how comfortable and effective your TENS treatment feels. The goal is to place pads where they can best influence the area of discomfort. Helpful Guidelines: Place pads around the painful area: Position electrodes on either side of the pain or along the surrounding muscles. Avoid placing pads directly over irritated or damaged skin. Keep pads evenly spaced: Proper spacing helps create a consistent stimulation pathway. Use both channels when available: This allows you to treat larger areas or multiple areas at the same time. Adjust placement if needed: Small changes in the pad location can improve comfort and sensation. Follow your device's instructions: Some conditions may have recommended placement patterns.",
          "Is there contradictions with medication?":
            "TENS generally does not interact with most medications because it works through electrical stimulation rather than through the bloodstream. However, your health condition and medications may still be important to discuss with a healthcare provider. Use caution and seek medical guidance if you: Take medications that affect sensation, nerve function, or heart rhythm. Have reduced ability to feel stimulation. Use medications that increase skin sensitivity or irritation risk. TENS should also be used carefully with certain medical conditions, such as: Implanted electronic devices (like pacemakers or defibrillators), Pregnancy, Epilepsy, Seizure Disorders, Areas with reduced sensation or damaged skin.",
          "Why am I not feeling sensation?":
            "If you are not feeling any stimulation, the issue is usually related to settings, connections, or electrode contact. Try these steps: increase the intensity slowly: The setting may simply be too low to feel. Check electrode placement: Move the pads slightly closer together or reposition them around the treatment area. Make sure pads are fully attached; Poor contact can prevent stimulation from being felt. Clean and dry your skin: Oils, lotions, or sweat can interfere with conductivity. Replace old electrode pads: Dry or worn pads may not transfer stimulation properly. Check cables and connections: Ensure lead wires are securely connected to the unit and pads. Confirm the correct mode/channel is active: Some programs have different sensation levels.",
          "Why does the stimulation seem weak?":
            "If your TENS unit feels weaker than usual, it is often caused by pad contact, settings, or power issues. Common causes include: Intensity is set too low: Gradually increase the intensity to a strong but comfortable level. Electrode pads are worn: Older pads may lose conductivity and reduce stimulation strength. Poor skin contact: Clean and dry your skin, then firmly apply the pads. Loose connections: Check that lead wires are securely attached to both the unit and pads. Low battery: Replace or recharge the battery if the device is losing power. Your body has adapted: Over time, you may notice the sensation less as your nerves become accustomed to the stimulation.",
          "Stimulation feels sharp or uncomfortable":
            "TENS stimulation should feel like a comfortable tingling, pulsing, or buzzing sensation - not sharp or painful. A sharp sensation usually means the stimulation is too intense or the pads are not making proper contact. Try: Lowering the intensity until the sensation becomes comfortable. Checking pad placement and moving pads away from bony areas or sensitive spots. Replacing old pads that may have dried out or lost even contact. Cleaning and drying your skin before applying electrodes.",
          "Why does intensity drop during use?":
            "A decrease in intensity during a session is usually caused by your body adapting to the stimulation, changes in skin contact, or device settings. Common causes include: Your body is adjusting to the sensation: It is normal to notice the stimulation less over time as your nerves become accustomed to it. Pads are losing contact: Movement, sweat, or drying electrodes can reduce conductivity. Automatic adjustment features: Some TENS programs change the stimulation pattern or strength to keep treatment comfortable. Low battery: Reduce power can affect stimulation strength. Loose connections: Check that the lead wires are securely attached.",
          "Why won't my TENS unit turn on?":
            "If your TENS unit will not power on, the issue is usually related to the battery, charging, or a connection problem. Try these steps: Check the battery: Replace disposable batteries or fully charge the device if it is rechargable. Confirm proper battery placement: Make sure batteries are inserted correctly and making contact. Try a different charger or cable: If rechargable, check that the charging cable and power source are working. Hold the power button: Some units require pressing and holding the button for a few seconds. Check for damage: Look for cracks, loose parts, or signs of moisture exposure. Disconnect accessories: Remove lead wires and pads, then try turning the unit on again. Review the user manual: Some devices have specific startup steps or safety locks.",
          "I am experiencing skin irritation -- why is that?":
            "Skin irriation after using a TENS unit is usually caused by skin sensitivity, electrode adhesive, or improper pad use. Common causes include: Sensitivity to the electrode gel or adhesive: Some people may have mild skin reactions to the materials in the pads. Using pads for too long: Extended use in the same area can irritate the skin. Worn or dirty electrodes: Old pads may not distribute stimulation evenly and can increase irritation. Applying pads to unprepared skin: Lotions, oils, sweat, or dirt can affect adhesion and skin comfort. Stimulation intensity is too high: Excessive intensity may cause discomfort or irritation. To reduce irritation: Apply pads to clean, dry skin. Rotate pad placement between sessions. Avoid using pads on irritated, broken, or sensitive skin. Lower the intensity if the sensation feels uncomfortable. Replace pads when they become dry or worn.",
          "How do I use a TENS unit, step by step?":
            "Start with clean, dry skin. Connect the lead wires to the pads, then plug them into the unit. Place the pads around the painful area, a few inches apart. Turn on the device, choose a mode, and slowly raise intensity until you feel a strong but comfortable tingling. Run the session 15-60 minutes, then power down and store the pads on their backing.",
          "What are typical troubleshooting issues with TENS units?":
            'Most issues come down to power, connections, pad contact, or settings. No sensation? Check the lead wires are seated and pads are on clean skin with intensity turned up. Weak or uneven feel? Replace worn electrodes. Unexpected shutoff? Usually the timer, low battery, or a safety response to poor contact. Your Ultima 5\'s Pad Contact Alarm flashes "CH1"/"CH2" if a connection starts failing.',
          "What is the Ultima 5 (U5)?":
            "The Ultima 5 is PMT's dual-channel digital TENS unit, built for robust relief at home, work, or on the go. It offers 10 intensity levels, 9 preset modes (27 combinations), 3 wave forms, and a timer up to 60 minutes. A built-in Compliance Monitor and Pad Contact Alarm add extra confidence.",
          "What comes in my Ultima 5 kit?":
            'Your kit includes the TENS device, manual, Quick Start Guide, one pack of 2" square electrodes, an AA charger, two pairs of leadwires, two rechargeable Li-ion batteries, a soft carrying case, and an instruction card, everything you need for your first session.',
          "What's different between the current Ultima 5 and the earlier model?":
            "Core performance is unchanged: dual channel, up to 130 mA, the same pulse width and rate range, 3 wave forms, and 9 modes. What's improved: more timer options (15-90 minutes plus continuous), a compliance lock feature, an upgraded carrying case, a manual with an electrode placement chart, and five color options instead of one.",
          "What are Soft-Touch electrodes, and why do they matter?":
            "Soft-Touch electrodes are PMT's premium reusable line: a non-porous tricot backing, conductive wire-mount layer, high-quality carbon layer, and extra-thick gel, with a snug pigtail connector. Oval corners minimize edge curl, and every pad uses latex-free USA gel in a resealable bag to stay fresh. They work well across TENS, EMS, interferential, microcurrent, and galvanic devices.",
          "What's the difference between the Soft-Touch Silver and Clinical Grade electrode lines?":
            'Both are premium reusable electrodes. The Silver series (SPS) uses a silver backing with ultra-low impedance and a gentle blue gel, great for sensitive skin, in sizes from 1.25" round up to 3" round. The Clinical Grade series (SP) uses a carbon backing with low-impedance blue gel and the widest size range, from a 1" round up to a 3.3"x6" butterfly pad.',
          "What does the Pad Contact Interruption Alarm do on my Ultima 5?":
            'It watches your connection for you. If contact weakens, "CH1" and/or "CH2" flashes on the display. After 3 seconds of poor contact, intensity automatically drops to 60%. If contact returns within 30 seconds, it climbs back to your original setting; if not, intensity resets to zero. It\'s off by default, hold "PR+" and "MODE" together to turn it on.',
          "What does the Compliance Monitor track, and why does it matter?":
            "It keeps a running total of your usage time, a simple way to track how consistently you're following your treatment plan. Press and hold the timer button to view your total; it clears from the display after about 2 seconds. To reset the count to zero, hold MODE and TIMER together.",
          "What wave forms does the Ultima 5 offer, and which one should I use?":
            'You get three: asymmetrical, symmetrical, and monophasic. Switch between them by pressing "PR-" and "PW-" together. For your first session, start with asymmetrical bi-phasic rectangular, the most comfortable default for most people. From there, try symmetrical for a more even feel during longer sessions, or monophasic for smaller, more sensitive areas.',
          "How do I turn my Ultima 5 on and off?":
            "Press and hold the power button for about 3 seconds to turn your Ultima 5 on. You'll see the green LED light up along with the display, and intensity always starts at zero so you can ease in comfortably. To power down, press and hold the same button again for 3 seconds.",
          "Why does the intensity reset to zero when I switch modes?":
            "This is expected behavior, not a malfunction. Any time you change modes on your Ultima 5, the intensity automatically drops back to zero as a safety measure, so you don't accidentally jump into a new mode at a high setting. Just turn the intensity knob back up to a comfortable level once you've selected your mode.",
          "Does my Ultima 5 remember my last settings when I turn it back on?":
            "Yes. When you power your Ultima 5 back on, it automatically returns to the mode it was running in before you turned it off, so you don't have to reconfigure everything each time. Intensity will still start at zero, as it does on every power-up.",
          "What is the auto-repeat feature when adjusting pulse rate or pulse width?":
            'Once you make your first adjustment to pulse rate or pulse width, an auto-repeat function kicks in. If you press and hold the "PR+", "PR-", "PW+", or "PW-" key for about 1 second, the value will keep increasing or decreasing automatically, one step every quarter-second, so you can dial in your setting faster without repeatedly tapping the button.',
          "How do the intensity knobs work on my Ultima 5?":
            "Your Ultima 5 has two knobs on top of the unit, one for each channel. Turn a knob clockwise to increase intensity on that channel, or counterclockwise to decrease it. This lets you fine-tune each channel independently if you're treating two different areas at once.",
          "How do I read the battery level indicator on my Ultima 5?":
            "The battery icon on your display uses a simple 2-bar system. Both bars showing means your battery is fully charged. One bar means you're at a mid-level charge. If the battery symbol starts flashing, that's your cue that the batteries are running low and should be recharged or replaced soon.",
          "Does my Ultima 5 automatically shut off if I forget to turn it off?":
            "Yes. If the intensity on both channels is set to zero and the unit hasn't been used for 5 minutes, it will automatically power down on its own, so you don't have to worry about it running down the battery if you step away.",
          "What is the Lock/Unlock feature, and how do I use it?":
            "The Lock/Unlock feature lets you hold your current intensity steady so it can't be accidentally bumped up or down mid-session, handy if the unit is clipped to your belt or moving around while you're active. With the unit on, give the power button a short press to lock it; your intensity level will be held in place. Give it another short press to unlock and resume adjusting normally.",
          "What settings should I use for my very first Ultima 5 session?":

        function createSparkBotSvg(size = 20) {
          const safeSize = Number.isFinite(Number(size)) ? Number(size) : 20;

        function escapeHtml(s) {
          return String(s ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }

        function getQuestionsForCategory(key) {
          return CATEGORY_QUESTIONS[key] || [];
        }
        function getCategoryQuestionCount(key) {
          return getQuestionsForCategory(key).length;
        }

        function getRelatedQuestions(userQuery, llmRelatedQuestions = []) {
          const normUserQuery = normalizeQ(userQuery);
          const candidates = [];
          const addedNorms = new Set();

          function addCandidate(q) {
            if (!q || typeof q !== "string") return;
            const trimmed = q.trim();
            const norm = normalizeQ(trimmed);
            if (!norm) return;
            if (askedQuestionsSet.has(norm)) return;
            if (addedNorms.has(norm)) return;
            candidates.push(trimmed);
            addedNorms.add(norm);
          }

          // 1. Add LLM-provided related questions first
          if (Array.isArray(llmRelatedQuestions)) {
            for (const q of llmRelatedQuestions) {
              addCandidate(q);
            }
          }

          // 2. Determine best matching category for userQuery
          let bestCategoryKey = null;
          let highestScore = 0;
          const userWords = userQuery.toLowerCase().split(/\W+/).filter((w) => w.length > 2);

          for (const catKey of Object.keys(CATEGORY_QUESTIONS)) {
            const questions = CATEGORY_QUESTIONS[catKey];
            let score = 0;
            const catObj = CATEGORIES.find((c) => c.key === catKey);
            if (catObj) {
              if (
                userQuery.toLowerCase().includes(catObj.title.toLowerCase()) ||
                userQuery.toLowerCase().includes(catKey.toLowerCase())
              ) {
                score += 5;
              }
            }
            for (const q of questions) {
              const qLower = q.toLowerCase();
              for (const w of userWords) {
                if (qLower.includes(w)) {
                  score += 1;
                }
              }
            }
            if (score > highestScore) {
              highestScore = score;
              bestCategoryKey = catKey;
            }
          }

          if (!bestCategoryKey) {
            bestCategoryKey = "basics";
          }

          // Add questions from best matching category
          if (CATEGORY_QUESTIONS[bestCategoryKey]) {
            for (const q of CATEGORY_QUESTIONS[bestCategoryKey]) {
              addCandidate(q);
            }
          }

          // Top up from all other categories if needed to reach 3
          for (const catKey of Object.keys(CATEGORY_QUESTIONS)) {
            if (candidates.length >= 3) break;
            if (catKey === bestCategoryKey) continue;
            for (const q of CATEGORY_QUESTIONS[catKey]) {
              addCandidate(q);
              if (candidates.length >= 3) break;
            }
          }

          return candidates.slice(0, 3);
        }

        function formatMessageText(text) {
          if (!text) return "";
          let clean = escapeHtml(text);
          // Convert Markdown bullet asterisks (* item) at line start to bullet symbol •
          clean = clean.replace(/^[\s]*\*\s+/gm, "• ");
          // Convert Markdown bold **text** to <strong>text</strong>
          clean = clean.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
          // Convert Markdown italic *text* to <em>text</em>
          clean = clean.replace(/\*([^*]+)\*/g, "<em>$1</em>");
          // Convert Markdown links [label](url) into target="_blank" HTML links
          clean = clean.replace(/\[([^\]]+)\]\((https?:\/\/[^\s\)]+)\)/g, (match, label, url) => {
            return `<a href="${url}" target="_blank" rel="noopener" style="color: #00aca0; text-decoration: underline; font-weight: 500;">${label}</a>`;
          });
          // Convert newlines to paragraphs and breaks
          clean = clean.replace(/\n\n+/g, "</p><p>").replace(/\n/g, "<br>");
          return `<p>${clean}</p>`;
        }

        async function ask(q, sourceCategoryKey = null) {
          if (!q || !q.trim()) return;

          const userQuery = q.trim();
          askedQuestionsSet.add(normalizeQ(userQuery));

          if (sourceCategoryKey) {
            answerReturnCategoryKey = sourceCategoryKey;
            activeCategoryKey = sourceCategoryKey;
          } else {
            answerReturnCategoryKey = null;
          }

          thread.push({ role: "user", text: userQuery });
          isTyping = true;
          renderThread();

          const webhookUrl = `https://n8n.srv917960.hstgr.cloud/webhook/spark-chatbot?chatInput=${encodeURIComponent(userQuery)}&question=${encodeURIComponent(userQuery)}&sessionId=${encodeURIComponent(sessionId)}`;

          try {
            const response = await fetch(webhookUrl, {
              method: "GET",
              headers: {
                "Accept": "application/json"
              }
            });

            if (!response.ok) {
              throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const data = await response.json();
            let replyText = "";
            let llmRelatedQuestions = [];

            let targetObj = data;
            if (Array.isArray(data) && data.length > 0) {
              targetObj = data[0];
            }

            if (typeof targetObj === "string") {
              try {
                const parsed = JSON.parse(targetObj);
                targetObj = parsed;
              } catch (e) {}
            }

            if (typeof targetObj === "object" && targetObj !== null) {
              replyText = targetObj.text || targetObj.output || targetObj.message || targetObj.response || targetObj.answer || "";
              if (Array.isArray(targetObj.relatedQuestions)) {
                llmRelatedQuestions = targetObj.relatedQuestions;
              } else if (Array.isArray(targetObj.related_questions)) {
                llmRelatedQuestions = targetObj.related_questions;
              } else if (Array.isArray(targetObj.related)) {
                llmRelatedQuestions = targetObj.related;
              }
            } else if (typeof targetObj === "string") {
              replyText = targetObj;
            }

            // Check if replyText is an embedded JSON string containing relatedQuestions
            if (!llmRelatedQuestions.length && typeof replyText === "string") {
              const jsonMatch = replyText.match(/```(?:json)?\s*([\s\S]*?)\s*```/) || replyText.match(/(\{[\s\S]*"relatedQuestions"[\s\S]*\})/i);
              if (jsonMatch) {
                try {
                  const parsed = JSON.parse(jsonMatch[1]);
                  if (parsed.answer || parsed.text || parsed.output) {
                    replyText = parsed.answer || parsed.text || parsed.output;
                  }
                  if (Array.isArray(parsed.relatedQuestions)) {
                    llmRelatedQuestions = parsed.relatedQuestions;
                  }
                } catch (e) {}
              }
            }

            if (!replyText) {
              replyText = typeof data === "string" ? data : "Sorry, I couldn't retrieve an answer at this time.";
            }

            const relatedQs = getRelatedQuestions(userQuery, llmRelatedQuestions);
            thread.push({ role: "assistant", text: replyText, relatedQuestions: relatedQs });
          } catch (error) {
            console.error("Spark Webhook Fetch Error:", error);
            const fallbackAnswer = KB_ANSWERS[userQuery] || KB_ANSWERS[Object.keys(KB_ANSWERS).find(k => k.toLowerCase() === userQuery.toLowerCase())] || "Sorry, I couldn't connect to Spark right now. Please try again or contact support directly at info@paintechnology.com";
            const relatedQs = getRelatedQuestions(userQuery, []);
            thread.push({ role: "assistant", text: fallbackAnswer, relatedQuestions: relatedQs });
          } finally {
            isTyping = false;
            renderThread();
          }
        }

          document.body.classList.toggle("pmt-theme-dark");
          document.body.classList.toggle("pmt-theme-light");
          const isDark = document.body.classList.contains("pmt-theme-dark");
          localStorage.setItem("spark_widget_theme", isDark ? "dark" : "light");
          updateThemeIcon();
        }

        if (btnTheme) {
          updateThemeIcon();
          btnTheme.addEventListener("click", toggleTheme);
        }

        btnSend.addEventListener("click", submitHomePrompt);
        elFreeText.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            submitHomePrompt();
          }
        });

        window.pmtWidgetActions = {
          ask,
          renderHome,
          renderCategory,
          submitHomePrompt,
          openContact: () => openContactForm(),
          openWarranty: () => window.open(WARRANTY_URL, "_blank"),
          toggleTheme,
        };

        // ── Contact Form Logic ──
        const contactOverlay = document.getElementById('pmtContactOverlay');
        const contactForm = document.getElementById('pmtContactForm');
        const contactCloseBtn = document.getElementById('pmtContactClose');

        function openContactForm() {
          contactOverlay.classList.add('open');
          resetContactForm();
          setTimeout(() => {
            const first = document.getElementById('pmtFirstName');
            if (first) first.focus();
          }, 100);
        }

        function closeContactForm() {
          contactOverlay.classList.remove('open');
        }

        function resetContactForm() {
          contactForm.reset();
          contactForm.querySelectorAll('.pmt-invalid').forEach(el => el.classList.remove('pmt-invalid'));
          contactForm.querySelectorAll('.pmt-form-error').forEach(el => el.textContent = '');
          // Restore form fields if showing success state
          const successEl = contactForm.querySelector('.pmt-contact-success');
          if (successEl) {
            contactForm.innerHTML = contactFormOriginalHTML;
          }
          const submitBtn = document.getElementById('pmtContactSubmit');
          if (submitBtn) submitBtn.disabled = false;
        }

        const contactFormOriginalHTML = contactForm.innerHTML;

        contactCloseBtn.addEventListener('click', closeContactForm);
        contactOverlay.addEventListener('click', (e) => {
          if (e.target === contactOverlay) closeContactForm();
        });

        function validateContactForm() {
          let isValid = true;
          const fields = [
            {
              id: 'pmtFirstName',
              errId: 'errFirstName',
              validate: (v) => {
                if (!v.trim()) return 'First name is required';
                if (v.trim().length < 2) return 'Must be at least 2 characters';
                if (!/^[a-zA-Z\s\-']+$/.test(v.trim())) return 'Only letters, spaces, hyphens allowed';
                return '';
              }
            },
            {
              id: 'pmtLastName',
              errId: 'errLastName',
              validate: (v) => {
                if (!v.trim()) return 'Last name is required';
                if (v.trim().length < 2) return 'Must be at least 2 characters';
                if (!/^[a-zA-Z\s\-']+$/.test(v.trim())) return 'Only letters, spaces, hyphens allowed';
                return '';
              }
            },
            {
              id: 'pmtEmail',
              errId: 'errEmail',
              validate: (v) => {
                if (!v.trim()) return 'Email is required';
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim())) return 'Enter a valid email address';
                return '';
              }
            },
            {
              id: 'pmtPhone',
              errId: 'errPhone',
              validate: (v) => {
                if (!v.trim()) return 'Phone number is required';
                const digits = v.replace(/[^\d]/g, '');
                if (digits.length < 7 || digits.length > 15) return 'Enter a valid phone number (7-15 digits)';
                return '';
              }
            },
            {
              id: 'pmtMessage',
              errId: 'errMessage',
              validate: (v) => {
                if (!v.trim()) return 'Message is required';
                if (v.trim().length < 10) return 'Message must be at least 10 characters';
                return '';
              }
            }
          ];

          for (const field of fields) {
            const input = document.getElementById(field.id);
            const errEl = document.getElementById(field.errId);
            const error = field.validate(input.value);
            if (error) {
              isValid = false;
              input.classList.add('pmt-invalid');
              if (errEl) errEl.textContent = error;
            } else {
              input.classList.remove('pmt-invalid');
              if (errEl) errEl.textContent = '';
            }
          }

          return isValid;
        }

        // Clear validation on input
        ['pmtFirstName', 'pmtLastName', 'pmtEmail', 'pmtPhone', 'pmtMessage'].forEach(id => {
          const el = document.getElementById(id);
          if (el) {
            el.addEventListener('input', () => {
              el.classList.remove('pmt-invalid');
              const errEl = el.parentElement.querySelector('.pmt-form-error');
              if (errEl) errEl.textContent = '';
            });
          }
        });

        contactForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          if (!validateContactForm()) return;

          const formData = {
            firstName: document.getElementById('pmtFirstName').value.trim(),
            lastName: document.getElementById('pmtLastName').value.trim(),
            email: document.getElementById('pmtEmail').value.trim(),
            phone: document.getElementById('pmtPhone').value.trim(),
            message: document.getElementById('pmtMessage').value.trim(),
            sessionId: sessionId
          };

          const submitBtn = document.getElementById('pmtContactSubmit');
          if (submitBtn) submitBtn.disabled = true;

          try {
            await fetch('https://n8n.srv917960.hstgr.cloud/webhook/support-ticket-spark', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(formData)
            });
          } catch (err) {
            console.error('Contact form webhook error:', err);
          }

          // Show success state
          const card = contactOverlay.querySelector('.pmt-contact-card');
          const header = card.querySelector('.pmt-contact-header');
          contactForm.innerHTML = `
            <div class="pmt-contact-success">
              <div class="pmt-success-icon">✓</div>
              <h3>Message Sent!</h3>
              <p>Thank you, ${escapeHtml(formData.firstName)}. Our team will get back to you shortly.</p>
            </div>
          `;

          setTimeout(() => closeContactForm(), 3000);
        });

        renderHome();
      });
    </script>
  </body>
</html>
