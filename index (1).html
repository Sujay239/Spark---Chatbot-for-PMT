 the device is not powering correctly.","reply":"If you don't feel any simulation from your TENS unit, check these common causes; Intensity is too low: Gradually increase the intensity until you feel a comfortable tingling or pulsing sensation. Pads are not making good contact: Make sure pads are fully attached to clean, dry skin. Electrodes are worn out: Old or dry pads may not transfer stimulation properly. Pad placement needs adjustment: Try moving the pads closer to the area of treatment or adjusting their postion. Cable or connection issue: Make sure the leads are securely connected to both the unit and the pads. Low Battery: Replace or recharge the battery if the device is not powering correctly.\n\nUseful Resources & Links:\n📋 [TENS Electrode Placement Chart](https://paintechnology.s3.amazonaws.com/pdf/placementchart.pdf)","transport":{"ok":true,"status":200,"latencyMs":2604,"error":null,"attempts":1,"sessionId":"spark_baseline_xnw6c29k6_1787239407474"},"assertions":[{"label":"non-empty answer","type":"minLength","severity":"critical","passed":true,"detail":""},{"label":"no contraindicated placement advice","type":"excludesAffirmed","severity":"critical","passed":true,"detail":""},{"label":"no prompt/system leakage","type":"excludes","severity":"critical","passed":true,"detail":""},{"label":"no raw plumbing artifacts","type":"excludes","severity":"major","passed":true,"detail":""},{"label":"no backend error surfaced to user","type":"excludes","severity":"critical","passed":true,"detail":""}],"lexical":{"coverage":1,"f1":1,"precision":1,"recall":1,"numerics":null,"missingTerms":[],"missingNumerics":[],"extraNumerics":[]},"structure":{"bodyChars":662,"resourceChars":99,"hasResourceBlock":true,"links":[{"label":"TENS Electrode Placement Chart","url":"https://paintechnology.s3.amazonaws.com/pdf/placementchart.pdf"}],"linkCount":1,"sentences":6,"latencyMs":2604,"withinSla":true,"issues":[]},"judge":null,"verdict":"pass","score":1,"reasons":[],"failedAssertions":[]},{"id":"baseline:kb-038","fellBack":false,"suite":"baseline","category":"troubleshooting","label":null,"kbId":"kb-038","question":"Why is only one pad working?","reference":"If only one pad seems to be producing a sensation, the issue is usually related to pad contact, connections, or the electrode itself. Try these steps: Check the pad connection: Make sure both lead wires are firmly connected to the TENS unit and electrode pads. Test the pads: Swap the pads or cables to see if the issue follows the pad or the channel. Replace the pad: A worn or dried-out electrode may not conduct properly. Improve the skin contact: Clean and dry the skin, then reapply the pads firmly. Check the channel settings: Make sure both channels are turned on if your unit has multiple channels.","reply":"If only one pad seems to be producing a sensation, the issue is usually related to pad contact, connections, or the electrode itself. Try these steps: Check the pad connection: Make sure both lead wires are firmly connected to the TENS unit and electrode pads. Test the pads: Swap the pads or cables to see if the issue follows the pad or the channel. Replace the pad: A worn or dried-out electrode may not conduct properly. Improve the skin contact: Clean and dry the skin, then reapply the pads firmly. Check the channel settings: Make sure both channels are turned on if your unit has multiple channels.","transport":{"ok":true,"status":200,"latencyMs":2424,"error":null,"attempts":1,"sessionId":"spark_baseline_hg71q6x5r_1787239407557"},"assertions":[{"label":"non-empty answer","type":"minLength","severity":"critical","passed":true,"detail":""},{"label":"no contraindicated placement advice","type":"excludesAffirmed","severity":"critical","passed":true,"detail":""},{"label":"no prompt/system leakage","type":"excludes","severity":"critical","passed":true,"detail":""},{"label":"no raw plumbing artifacts","type":"excludes","severity":"major","passed":true,"detail":""},{"label":"no backend error surf t direct sunlight. Store cables neatly to prevent bending or damage.","transport":{"ok":true,"status":200,"latencyMs":2521,"error":null,"attempts":1,"sessionId":"spark_baseline_u09fkdugg_1787239426874"},"assertions":[{"label":"non-empty answer","type":"minLength","severity":"critical","passed":true,"detail":""},{"label":"no contraindicated placement advice","type":"excludesAffirmed","severity":"critical","passed":true,"detail":""},{"label":"no prompt/system leakage","type":"excludes","severity":"critical","passed":true,"detail":""},{"label":"no raw plumbing artifacts","type":"excludes","severity":"major","passed":true,"detail":""},{"label":"no backend error surfaced to user","type":"excludes","severity":"critical","passed":true,"detail":""}],"lexical":{"coverage":1,"f1":1,"precision":1,"recall":1,"numerics":null,"missingTerms":[],"missingNumerics":[],"extraNumerics":[]},"structure":{"bodyChars":610,"resourceChars":0,"hasResourceBlock":false,"links":[],"linkCount":0,"sentences":10,"latencyMs":2521,"withinSla":true,"issues":[]},"judge":null,"verdict":"pass","score":1,"reasons":[],"failedAssertions":[]},{"id":"baseline:kb-060","fellBack":false,"suite":"baseline","category":"basics","label":null,"kbId":"kb-060","question":"How do I maximize pain relief?","reference":"To get the best results from your TENS unit, focus on proper placement, comfortable settings, and consistent use. Tips to maximize relief: Place pads correctly: Position electrodes around the painful area or along the related nerve pathways as recommended. Use a comfortable intensity: The sensation should feel strong but comfortable - not painful or irritating. Adjust settings: Try different modes, pulse rates, and durations to find what works best for you. Use fresh electrodes - Good pad contact helps deliver consistent stimulation. Keep skin clean and dry: Remove oils, lotions, and sweat before applying pads. Use consistently: Regular sessions may provide better results than occasional use.","reply":"To get the best results from your TENS unit, focus on proper placement, comfortable settings, and consistent use. Tips to maximize relief: Place pads correctly: Position electrodes around the painful area or along the related nerve pathways as recommended. Use a comfortable intensity: The sensation should feel strong but comfortable - not painful or irritating. Adjust settings: Try different modes, pulse rates, and durations to find what works best for you. Use fresh electrodes - Good pad contact helps deliver consistent stimulation. Keep skin clean and dry: Remove oils, lotions, and sweat before applying pads. Use consistently: Regular sessions may provide better results than occasional use.","transport":{"ok":true,"status":200,"latencyMs":2408,"error":null,"attempts":1,"sessionId":"spark_baseline_rz3ikfsj7_1787239426955"},"assertions":[{"label":"non-empty answer","type":"minLength","severity":"critical","passed":true,"detail":""},{"label":"no contraindicated placement advice","type":"excludesAffirmed","severity":"critical","passed":true,"detail":""},{"label":"no prompt/system leakage","type":"excludes","severity":"critical","passed":true,"detail":""},{"label":"no raw plumbing artifacts","type":"excludes","severity":"major","passed":true,"detail":""},{"label":"no backend error surfaced to user","type":"excludes","severity":"critical","passed":true,"detail":""}],"lexical":{"coverage":1,"f1":1,"precision":1,"recall":1,"numerics":null,"missingTerms":[],"missingNumerics":[],"extraNumerics":[]},"structure":{"bodyChars":701,"resourceChars":0,"hasResourceBlock":false,"links":[],"linkCount":0,"sentences":7,"latencyMs":2408,"withinSla":true,"issues":[]},"judge":null,"verdict":"pass","score":1,"reasons":[],"failedAssertions":[]},{"id":"baseline:kb-061","fellBack":false,"suite":"baseline","category":"efficacy","label":null,"kbId":"kb-061","question":"What are the theories behind how TENS units work?","reference":"There are two leading theories that explain why TENS provides relief, and understanding them can help you get more out of your device. The first is the Gate Control Theory of Pain. It suggests that the electrical pulses from your TENS unit travel along nerve fibers faster than pain signals do, effectively closing a \"gate\" in your spinal cord so fewer pain signals reach your brain. This is generally associated with higher frequency settings and tends to provide faster, more immediate relief. The second is the Endorphin Release Theory, which suggests that certain settings, typically lower frequencies, encourage your body to release endorphins, its own natural pain-relieving chemicals. This effect tends to build more gradually and can last longer after your session ends. Many people find that combining both approaches, or simply experimenting with frequency over a few sessions, helps them find what works best for their body.","reply":"There are two leading theories that explain why TENS provides relief, and understanding them can help you get more out of your device. The first is the Gate Control Theory of Pain. It suggests that the electrical pulses from your TENS unit travel along nerve fibers faster than pain signals do, effectively closing a \"gate\" in your spinal cord so fewer pain signals reach your brain. This is generally associated with higher frequency settings and tends to provide faster, more immediate relief. The second is the Endorphin Release Theory, which suggests that certain settings, typically lower frequencies, encourage your body to release endorphins, its own natural pain-relieving chemicals. This effect tends to build more gradually and can last longer after your session ends. Many people find that combining both approaches, or simply experimenting with frequency over a few sessions, helps them find what works best for their body.","transport":{"ok":true,"status":200,"latencyMs":1927,"error":null,"attempts":1,"sessionId":"spark_baseline_cvg7w80zm_1787239427902"},"assertions":[{"label":"non-empty answer","type  and medications may still be important to discuss with a healthcare provider. Use caution and seek medical guidance if you: Take medications that affect sensation, nerve function, or heart rhythm. Have reduced ability to feel stimulation. Use medications that increase skin sensitivity or irritation risk. TENS should also be used carefully with certain medical conditions, such as: Implanted electronic devices (like pacemakers or defibrillators), Pregnancy, Epilepsy, Seizure Disorders, Areas with reduced sensation or damaged skin.","reply":"TENS generally does not interact with most medications because it works through electrical stimulation rather than through the bloodstream. However, your health condition and medications may still be important to discuss with a healthcare provider. Use caution and seek medical guidance if you: Take medications that affect sensation, nerve function, or heart rhythm. Have reduced ability to feel stimulation. Use medications that increase skin sensitivity or irritation risk. TENS should also be used carefully with certain medical conditions, such as: Implanted electronic devices (like pacemakers or defibrillators), Pregnancy, Epilepsy, Seizure Disorders, Areas with reduced sensation or damaged skin.","transport":{"ok":true,"status":200,"latencyMs":2356,"error":null,"attempts":1,"sessionId":"spark_baseline_khorlzkz8_1787239429545"},"assertions":[{"label":"non-empty answer","type":"minLength","severity":"critical","passed":true,"detail":""},{"label":"no contraindicated placement advice","type":"excludesAffirmed","severity":"critical","passed":true,"detail":""},{"label":"no prompt/system leakage","type":"excludes","severity":"critical","passed":true,"detail":""},{"label":"no raw plumbing artifacts","type":"excludes","severity":"major","passed":true,"detail":""},{"label":"no backend error surfaced to user","type":"excludes","severity":"critical","passed":true,"detail":""}],"lexical":{"coverage":1,"f1":1,"precision":1,"recall":1,"numerics":null,"missingTerms":[],"missingNumerics":[],"extraNumerics":[]},"structure":{"bodyChars":705,"resourceChars":0,"hasResourceBlock":false,"links":[],"linkCount":0,"sentences":6,"latencyMs":2356,"withinSla":true,"issues":[]},"judge":null,"verdict":"pass","score":1,"reasons":[],"failedAssertions":[]},{"id":"baseline:kb-064","fellBack":false,"suite":"baseline","category":"troubleshooting","label":null,"kbId":"kb-064","question":"Why am I not feeling sensation?","reference":"If you are not feeling any stimulation, the issue is usually related to settings, connections, or electrode contact. Try these steps: increase the intensity slowly: The setting may simply be too low to feel. Check electrode placement: Move the pads slightly closer together or reposition them around the treatment area. Make sure pads are fully attached; Poor contact can prevent stimulation from being felt. Clean and dry your skin: Oils, lotions, or sweat can interfere with conductivity. Replace old electrode pads: Dry or worn pads may not transfer stimulation properly. Check cables and connections: Ensure lead wires are securely connected to the unit and pads. Confirm the correct mode/channel is active: Some programs have different sensation levels.","reply":"If you are not feeling any stimulation, the issue is usually related to settings, connections, or electrode contact. Try these steps: increase the intensity slowly: The setting may simply be too low to feel. Check electrode placement: Move the pads slightly closer together or reposition them around the treatment area. Make sure pads are fully attached; Poor contact can prevent stimulation from being felt. Clean and dry your skin: Oils, lotions, or sweat can interfere with conductivity. Replace old electrode pads: Dry or worn pads may not transfer stimulation properly. Check cables and connections: Ensure lead wires are securely connected to the unit and pads. Confirm the correct mode/channel is active: Some programs have different sensation levels.","transport":{"ok":true,"status":200,"latencyMs":2321,"error":null,"attempts":1,"sessionId":"spark_baseline_1v2a73v72_1787239429833"},"assertions":[{"label":"non-empty answer","type":"minLength","severity":"critical","passed":true,"detail":""},{"label":"no contraindicated placement advice","type":"excludesAffirmed","severity":"critical","passed":true,"detail":""},{"label":"no prompt/system leakage","type":"excludes","severity":"critical","passed":true,"detail":""},{"label":"no raw plumbing artifacts","type":"excludes","severity":"major","passed":true,"detail":""},{"label":"no backend error surfaced to user","type":"excludes","severity":"critical","passed":true,"detail":""}],"lexical":{"coverage":1,"f1":1,"precision":1,"recall":1,"numerics":null,"missingTerms":[],"missingNumerics":[],"extraNumerics":[]},"structure":{"bodyChars":758,"resourceChars":0,"hasResourceBlock":false,"links":[],"linkCount":0,"sentences":8,"latencyMs":2321,"withinSla":true,"issues":[]},"judge":null,"verdict":"pass","score":1,"reasons":[],"failedAssertions":[]},{"id":"baseline:kb-065","fellBack":false,"suite":"baseline","category":"troubleshooting","label":null,"kbId":"kb-065","question":"Why does the stimulation seem weak?","reference":"If your TENS unit feels weaker than usual, it is often caused by pad contact, settings, or power issues. Common causes include: Intensity is set too low: Gradually increase the intensity to a strong but comfortable level. Electrode pads are worn: Older pads may lose conductivity and reduce stimulation strength. Poor skin contact: Clean and dry your skin, then firmly apply the pads. Loose connections: Check that lead wires are securely attached to both the unit and pads. Low battery: Replace or recharge the battery if the device is losing power. Your body has adapted: Over time, you may notice the sensation less as your nerves become accustomed to the stimulation.","reply":"If your TENS unit feels weaker than usual, it is often caused by pad contact, settings, or power issues. Common causes include: Intensity is set too low: Gradually increase the intensity to a strong but comfortable level. Electrode pads are worn: Older pads may lose conductivity and reduce stimulation strength. Poor skin contact: Clean and dry your skin, then firmly apply the pads. Loose connections: Check that lead wires are securely attached to both the unit and pads. Low battery: Replace or recharge the battery if the device is losing power. Your body has adapted: Over time, you may notice the sensation less as your nerves become accustomed to the stimulation.","transport":{"ok":true,"status":200,"latencyMs":2518,"error":null,"attempts":1,"sessionId":"spark_baseline_16owtc61d_1787239431935"},"assertions":[{"label":"non-empty answer","type":"minLength","severity":"critical","passed":true,"detail":""},{"label":"no contraindicated placement advice","type":"excludesAffirmed","severity":"critical","passed":true,"detail":""},{"label":"no prompt/system leakage","type":"excludes","severity":"critical","passed":true,"detail":""},{"label":"no raw plumbing artifacts","type":"excludes","severity":"major","passed":true,"detail":""},{"label":"no backend error surfaced to user","type":"excludes","severity":"critical","passed":true,"detail":""}],"lexical":{"coverage":1,"f1":1,"precision":1,"recall":1,"numerics":null,"missingTerms":[],"missingNumerics":[],"extraNumerics":[]},"structure":{"bodyChars":671,"resourceChars":0,"hasResourceBlock":false,"links":[],"linkCount":0,"sentences":7,"latencyMs":2518,"withinSla":true,"issues":[]},"judge":null,"verdict":"pass","score":1,"reasons":[],"failedAssertions":[]},{"id":"baseline:kb-066","fellBack":false,"suite":"baseline","category":"troubleshooting","label":null,"kbId":"kb-066","question":"Stimulation feels sharp or uncomfortable","reference":"TENS stimulation should feel like a comfortable tingling, pulsing, or buzzing sensation - not sharp or painful. A sharp sensation usually means the stimulation is too intense or the pads are not making proper contact. Try: Lowering the intensity until the sensation becomes comfortable. Checking pad placement and moving pads away from bony areas or sensitive spots. Replacing old pads that may have dried out or lost even contact. Cleaning and drying your skin before applying electrodes.","reply":"TENS stimulation should feel like a comfortable tingling, pulsing, or buzzing sensation - not sharp or painful. A sharp sensation usually means the stimulation is too intense or the pads are not making proper contact. Try: Lowering the intensity until the sensation becomes comfortable. Checking pad placement and moving pads away from bony areas or sensitive spots. Replacing old pads that may have dried out or lost even contact. Cleaning and drying your skin before applying electrodes.\n\nUseful Resources & Links:\n📋 [TENS Electrode Placement Chart](https://paintechnology.s3.amazonaws.com/pdf/placementchart.pdf)","transport":{"ok":true,"status":200,"latencyMs":2364,"error":null,"attempts":1,"sessionId":"spark_baseline_6ulznbp4s_1787239432009"},"assertions":[{"label":"non-empty answer","type":"minLength","severity":"critical","passed":true,"detail":""},{"label":"no contraindicated placement advice","type":"excludesAffirmed","severity":"critical","passed":true,"detail":""},{"label":"no prompt/system leakage","type":"excludes","severity":"critical","passed":true,"detail":""},{"label":"no raw plumbing artifacts","type":"excludes","severity":"major","passed":true,"detail":""},{"label":"no backend error surfaced to user","type":"excludes","severity":"critical","passed":true,"detail":""}],"lexical":{"coverage":1,"f1":1,"precision":1,"recall":1,"numerics":null,"missingTerms":[],"missingNumerics":[],"extraNumerics":[]},"structure":{"bodyChars":489,"resourceChars":99,"hasResourceBlock":true,"links":[{"label":"TENS Electrode Placement Chart","url":"https://paintechnology.s3.amazonaws.com/pdf/placementchart.pdf"}],"linkCount":1,"sentences":6,"latencyMs":2364,"withinSla":true,"issues":[]},"judge":null,"verdict":"pass","score":1,"reasons":[],"failedAssertions":[]},{"id":"baseline:kb-067","fellBack":false,"suite":"baseline","category":"troubleshooting","label":null,"kbId":"kb-067","question":"Why does intensity drop during use?","reference":"A decrease in intensity during a session is usually caused by your body adapting to the stimulation, changes in skin contact, or device settings. Common causes include: Your body is adjusting to the sensation: It is normal to notice the stimulation less over time as your nerves become accustomed to it. Pads are losing contact: Movement, sweat, or drying electrodes can reduce conductivity. Automatic adjustment features: Some TENS programs change the stimulation pattern or strength to keep treatment comfortable. Low battery: Reduce power can affect stimulation strength. Loose connections: Check that the lead wires are securely attached.","reply":"A decrease in intensity during a session is usually caused by your body adapting to the stimulation, changes in skin contact, or device settings. Common causes include: Your body is adjusting to the sensation: It is normal to notice the stimulation less over time as your nerves become accustomed to it. Pads are losing contact: Movement, sweat, or drying electrodes can reduce conductivity. Automatic adjustment features: Some TENS programs change the stimulation pattern or strength to keep treatment comfortable. Low battery: Reduce power can affect stimulation strength. Loose connections: Check that the lead wires are securely attached.","transport":{"ok":true,"status":200,"latencyMs":2474,"error":null,"attempts":1,"sessionId":"spark_baseline_k8h7zaz3z_1787239432224"},"assertions":[{"label":"non-empty answer","type":"minLength","severity":"critical","passed":true,"detail":""},{"label":"no contraindicated placement advice","type":"excludesAffirmed","severity":"critical","passed":true,"detail":""},{"label":"no prompt/system leakage","type":"excludes","severity":"critical","passed":true,"detail":""},{"label":"no raw plumbing artifacts","type":"excludes","severity":"major","passed":true,"detail":""},{"label":"no backend error surfaced to user","type":"excludes","severity":"critical","passed":true,"detail":""}],"lexical":{"coverage":1,"f1":1,"precision":1,"recall":1,"numerics":null,"missingTerms":[],"missingNumerics":[],"extraNumerics":[]},"structure":{"bodyChars":642,"resourceChars":0,"hasResourceBlock":false,"links":[],"linkCount":0,"sentences":6,"latencyMs":2474,"withinSla":true,"issues":[]},"judge":null,"verdict":"pass","score":1,"reasons":[],"failedAssertions":[]},{"id":"baseline:kb-068","fellBack":false,"suite":"baseline","category":"troubleshooting","label":null,"kbId":"kb-068","question":"Why won't my TENS unit turn on?","reference":"If your TENS unit will not power on, the issue is usually related to the battery, charging, or a connection problem. Try these steps: Check the battery: Replace disposable batteries or fully charge the device if it is rechargable. Confirm proper battery placement: Make sure batteries are inserted correctly and making contact. Try a different charger or cable: If rechargable, check that the charging cable and power source are working. Hold the power button: Some units require pressing and holding the button for a few seconds. Check for damage: Look for cracks, loose parts, or signs of moisture exposure. Disconnect accessories: Remove lead wires and pads, then try turning the unit on again. Review the user manual: Some devices have specific startup steps or safety locks.","reply":"If your TENS unit will not power on, the issue is usually related to the battery, charging, or a connection problem. Try these steps: Check the battery: Replace disposable batteries or fully charge the device if it is rechargable. Confirm proper battery placement: Make sure batteries are inserted correctly and making contact. Try a different charger or cable: If rechargable, check that the charging cable and power source are working. Hold the power button: Some units require pressing and holding the button for a few seconds. Check for damage: Look for cracks, loose parts, or signs of moisture exposure. Disconnect accessories: Remove lead wires and pads, then try turning the unit on again. Review the user manual: Some devices have specific startup steps or safety locks.","transport":{"ok":true,"status":200,"latencyMs":2821,"error":null,"attempts":1,"sessionId":"spark_baseline_obezmwrpn_1787239434456"},"assertions":[{"label":"non-empty answer","type":"minLength","severity":"critical","passed":true,"detail":""},{"label":"no contraindicated placement advice","type":"excludesAffirmed","severity":"critical","passed":true,"detail":""},{"label":"no prompt/system leakage","type":"excludes","severity":"critical","passed":true,"detail":""},{"label":"no raw plumbing artifacts","type":"excludes","severity":"major","passed":true,"detail":""},{"label":"no backend error surfaced to user","type":"excludes","severity":"critical","passed":true,"detail":""}],"lexical":{"coverage":1,"f1":1,"precision":1,"recall":1,"numerics":null,"missingTerms":[],"missingNumerics":[],"extraNumerics":[]},"structure":{"bodyChars":779,"resourceChars":0,"hasResourceBlock":false,"links":[],"linkCount":0,"sentences":8,"latencyMs":2821,"withinSla":true,"issues":[]},"judge":null,"verdict":"pass","score":1,"reasons":[],"failedAssertions":[]},{"id":"baseline:kb-069","fellBack":false,"suite":"baseline","category":"troubleshooting","label":null,"kbId":"kb-069","question":"I am experiencing skin irritation -- why is that?","reference":"Skin irriation after using a TENS unit is usually caused by skin sensitivity, electrode adhesive, or improper pad use. Common causes include: Sensitivity to the electrode gel or adhesive: Some people may have mild skin reactions to the materials in the pads. Using pads for too long: Extended use in the same area can irritate the skin. Worn or dirty electrodes: Old pads may not distribute stimulation evenly and can increase irritation. Applying pads to unprepared skin: Lotions, oils, sweat, or dirt can affect adhesion and skin comfort. Stimulation intensity is too high: Excessive intensity may cause discomfort or irritation. To reduce irritation: Apply pads to clean, dry skin. Rotate pad placement between sessions. Avoid using pads on irritated, broken, or sensitive skin. Lower the intensity if the sensation feels uncomfortable. Replace pads when they become dry or worn.","reply":"Skin irriation after using a TENS unit is usually caused by skin sensitivity, electrode adhesive, or improper pad use. Common causes include: Sensitivity to the electrode gel or adhesive: Some people may have mild skin reactions to the materials in the pads. Using pads for too long: Extended use in the same area can irritate the skin. Worn or dirty electrodes: Old pads may not distribute stimulation evenly and can increase irritation. Applying pads to unprepared skin: Lotions, oils, sweat, or dirt can affect adhesion and skin comfort. Stimulation intensity is too high: Excessive intensity may cause discomfort or irritation. To reduce irritation: Apply pads to clean, dry skin. Rotate pad placement between sessions. Avoid using pads on irritated, broken, or sensitive skin. Lower the intensity if the sensation feels uncomfortable. Replace pads when they become dry or worn.\n\nUseful Resources & Links:\n📋 [TENS Electrode Placement Chart](https://paintechnology.s3.amazonaws.com/pdf/placementchart.pdf)","transport":{"ok":true,"status":200,"latencyMs":3082,"error":null,"attempts":1,"sessionId":"spark_baseline_ln1jw8kdi_1787239434565"},"assertions":[{"label":"non-empty answer","type":"minLength","severity":"critical","passed":true,"detail":""},{"label":"no contraindicated placement advice","type":"excludesAffirmed","severity":"critical","passed":true,"detail":""},{"label":"no prompt/system leakage","type":"excludes","severity":"critical","passed":true,"detail":""},{"label":"no ra  is a small, battery-powered device that helps relieve pain by sending low-voltage electrical pulses through electrode pads placed on the skin. These gentle electrical impulses stimulate the nerves beneath the skin and can help reduce the way your body perceives pain.","reply":"Yes. TENS has been proven to help relieve pain for many people, although results can vary depending on the individual and the condition being treated. It works by stimulating the nerves, which may help reduce pain signals and encourage the relese of the body's natural pain-relieving chemicals. For best results, use the TENS unit as directed with proper pad placement and comfortable intensity settings.\n\nUseful Resources & Links:\n📋 [TENS Electrode Placement Chart](https://paintechnology.s3.amazonaws.com/pdf/placementchart.pdf)","transport":{"ok":true,"status":200,"latencyMs":3285,"error":null,"attempts":1,"sessionId":"spark_paraphrase_xfqujq368_1787239461591"},"assertions":[{"label":"non-empty answer","type":"minLength","severity":"critical","passed":true,"detail":""},{"label":"no contraindicated placement advice","type":"excludesAffirmed","severity":"critical","passed":true,"detail":""},{"label":"no prompt/system leakage","type":"excludes","severity":"critical","passed":true,"detail":""},{"label":"no raw plumbing artifacts","type":"excludes","severity":"major","passed":true,"detail":""},{"label":"no backend error surfaced to user","type":"excludes","severity":"critical","passed":true,"detail":""}],"lexical":{"coverage":0.241,"f1":0.305,"precision":0.257,"recall":0.375,"numerics":null,"missingTerms":["electrical","stimulation","small","battery-powered","sending","low-voltage","pulse","placed","skin","gentle","impulse","stimulate","beneath","way","perceive"],"missingNumerics":[],"extraNumerics":[]},"structure":{"bodyChars":404,"resourceChars":99,"hasResourceBlock":true,"links":[{"label":"TENS Electrode Placement Chart","url":"https://paintechnology.s3.amazonaws.com/pdf/placementchart.pdf"}],"linkCount":1,"sentences":4,"latencyMs":3285,"withinSla":true,"issues":[]},"judge":null,"verdict":"warn","score":0.257,"reasons":["advisory: low term coverage (0.257) — reworded question may have missed retrieval"],"failedAssertions":[]},{"id":"paraphrase:kb-001:2","fellBack":false,"suite":"paraphrase","category":"basics","label":null,"kbId":"kb-001","question":"Can you explain the science behind a TENS machine?","reference":"A Transcutaneous Electrical Nerve Stimulation (TENS) unit is a small, battery-powered device that helps relieve pain by sending low-voltage electrical pulses through electrode pads placed on the skin. These gentle electrical impulses stimulate the nerves beneath the skin and can help reduce the way your body perceives pain.","reply":"A TENS unit (Transcutaneous Electrical Nerve Stimulation) uses small electrical pulses on the skin to change how your nervous system processes pain. Two main scientific ideas explain this:\n\n1) Gate Control Theory of Pain  \n- Your body sends pain signals to the spinal cord, then up to the brain.  \n- TENS sends faster, non-painful electrical signals along nearby nerves.  \n- These faster signals can “close the gate” in the spinal cord, so fewer pain messages get through to the brain.  \n- This effect is usually linked to higher frequency settings and often gives quicker, more immediate relief while the unit is on.\n\n2) Endorphin Release Theory  \n- At certain settings (often lower frequencies), TENS can stimulate the body to release endorphins, which are natural pain-relieving chemicals.  \n- This effect builds more slowly, but relief may last even after you turn the unit off.\n\nWhat the device is physically doing  \n- Electrodes (sticky pads) are placed on the skin near the painful area.  \n- The unit sends controlled, low-voltage pulses through the pads into the superficial nerves (usually 1–2 inches deep).  \n- These pulses don’t fix tissue damage; instead, they modify pain signaling and can help muscles relax and improve comfort so activity is easier.\n\nKey points  \n- TENS is for pain management, not curing the underlying condition.  \n- Relief can be immediate or gradual, and varies from person to person.  \n- Many people use a mix of frequencies over several sessions to find what feels best for them.\n\nIf you’d like, I can explain how different settings (frequency, pulse width, modes) relate to these two mechanisms.","transport":{"ok":true,"status":200,"latencyMs":12687,"error":null,"attempts":1,"sessionId":"spark_paraphrase_tiry9kqa1_1787239462571"},"assertions":[{"label":"non-empty answer","type":"minLength","severity":"critical","passed":true,"detail":""},{"label":"no contraindicated placement advice","type":"excludesAffirmed","severity":"critical","passed":true,"detail":""},{"label":"no prompt/system leakage","type":"excludes","severity":"critical","passed":true,"detail":""},{"label":"no raw plumbing artifacts","type":"excludes","severity":"major","passed":true,"detail":""},{"label":"no backend error surfaced to user","type":"excludes","severity":"critical","passed":true,"detail":""}],"lexical":{"coverage":0.49,"f1":0.233,"precision":0.143,"recall":0.625,"numerics":null,"missingTerms":["battery-powered","relieve","sending","gentle","impulse","beneath","reduce","way","perceive"],"missingNumerics":[],"extraNumerics":["1-2inch"]},"structure":{"bodyChars":1634,"resourceChars":0,"hasResourceBlock":false,"links":[],"linkCount":0,"sentences":14,"latencyMs":12687,"withinSla":true,"issues":[]},"judge":null,"verdict":"warn","score":0.426,"reasons":["content score 0.426 below pass threshold 0.6"],"failedAssertions":[]},{"id":"paraphrase:kb-002:1","fellBack":false,"suite":"paraphrase","category":"basics","label":null,"kbId":"kb-002","question":"what am I supposed to feel when it's on?","reference":"Most users describe the sensation as: a gentle tingling, a light buzzing, mild tapping or pulsing, or a comfortable vibration. The intensity should be strong, but comfortable. A TENS unit should never be painful. If you experience sharp, burning, or uncomfortable sensations, reduce the intensity or check that the electrode pads are properly positioned and making good contact with your skin.","reply":"Most people feel one or more of the following when a TENS unit is on:\n\n• Gentle tingling  \n• Light buzzing  \n• Mild tapping or pulsing  \n• A comfortable vibration\n\nThe intensity should be strong but still comfortable. It should never feel sharp, burning, or painful.  \n\nIf it does feel uncomfortable, lower the intensity and check that the electrode pads are making good, even contact with clean, dry skin and are placed correctly around the area you’re treating.","transport":{"ok":true,"status":200,"latencyMs":6363,"error":null,"attempts":1,"sessionId":"spark_paraphrase_tkda7cv8w_1787239464878"},"assertions":[{"label":"non-empty answer","type":"minLength","severity":"critical","passed":true,"detail":""},{"label":"no contraindicated placement advice","type":"excludesAffirmed","severity":"critical","passed":true,"detail":""},{"label":"no prompt/system leakage","type":"excludes","severity":"critical","passed":true,"detail":""},{"label":"no raw plumbing artifacts","type":"excludes","severity":"major","passed":true,"detail":""},{"label":"no backend error surfaced to user","type":"excludes","severity":"critical","passed":true,"detail":""}],"lexical":{"coverage":0.745,"f1":0.696,"precision":0.632,"recall":0.774,"numerics":null,"missingTerms":["user","describe","sensation","experience","reduce","properly","positioned"],"missingNumerics":[],"extraNumerics":[]},"structure":{"bodyChars":463,"resourceChars":0,"hasResourceBlock":false,"links":[],"linkCount":0,"sentences":3,"latencyMs":6363,"withinSla":true,"issues":[]},"judge":null,"verdict":"pass","score":0.733,"reasons":[],"failedAssertions":[]},{"id":"paraphrase:kb-002:2","fellBack":false,"suite":"paraphrase","category":"basics","label":null,"kbId":"kb-002","question":"Is a TENS unit supposed to h between pain relief and muscle stimulation.","reply":"Electrical Muscle Stimulation (EMS) is not the same thing as TENS, even though both use electrical pulses.\n\nBased on the information in the knowledge base:\n\n- TENS (Transcutaneous Electrical Nerve Stimulation)  \n  - Purpose: Primarily for pain relief  \n  - How it works: Stimulates sensory nerves to help reduce or block pain signals and may encourage the release of natural pain-relieving chemicals  \n  - Best suited for: Nerve-related pain conditions (acute and chronic), such as back pain, arthritis, sciatica, etc.\n\n- EMS (Electrical Muscle Stimulation)  \n  - Purpose: Muscle activation and conditioning  \n  - How it works: Stimulates motor nerves to cause muscles to contract  \n  - Best suited for: Preventing or reducing muscle atrophy, improving muscle strength and endurance, increasing blood flow, and helping with muscle-related pain like spasms or soreness\n\nSome modern devices combine both TENS and EMS in one unit, allowing you to choose pain relief (TENS) or muscle stimulation (EMS) depending on your goal.","transport":{"ok":true,"status":200,"latencyMs":17302,"error":null,"attempts":1,"sessionId":"spark_paraphrase_6shpkbj5p_1787239608164"},"assertions":[{"label":"non-empty answer","type":"minLength","severity":"critical","passed":true,"detail":""},{"label":"no contraindicated placement advice","type":"excludesAffirmed","severity":"critical","passed":true,"detail":""},{"label":"no prompt/system leakage","type":"excludes","severity":"critical","passed":true,"detail":""},{"label":"no raw plumbing artifacts","type":"excludes","severity":"major","passed":true,"detail":""},{"label":"no backend error surfaced to user","type":"excludes","severity":"critical","passed":true,"detail":""}],"lexical":{"coverage":0.587,"f1":0.412,"precision":0.303,"recall":0.645,"numerics":null,"missingTerms":["although","designed","different","used","relieve","stimulating","strengthening","recovery","re-education","mode","swi <script>
const RUN = JSON.parse(document.getElementById("run").textContent);
const S = RUN.summary;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = n => (n*100).toFixed(1) + "%";

document.getElementById("meta").innerHTML =
  new Date(RUN.startedAt).toLocaleString() + " · endpoint <code>" + esc(RUN.endpoint) + "</code>" +
  " · answer key <code>" + esc(RUN.kbSource) + "</code> (" + RUN.kbCount + " entries)" +
  " · judge: " + (RUN.judge ? "<code>"+esc(RUN.judge)+"</code>" : "deterministic only");

document.getElementById("cards").innerHTML = [
  ["", S.total, "cases run"],
  ["pass", S.pass, "passed"],
  ["warn", S.warn, "warnings"],
  ["fail", S.fail, "failed"],
  [S.criticalFailures ? "fail" : "pass", S.criticalFailures, "critical"],
  ["", pct(S.passRate), "pass rate"],
  ["", S.latency.p50 + "ms", "latency p50"],
  ["", S.latency.p90 + "ms", "latency p90"],
].map(([cls,n,l]) => '<div class="card"><div class="n '+cls+'">'+n+'</div><div class="l">'+l+'</div></div>').join("");

function breakdown(el, obj){
  const rows = Object.entries(obj).sort((a,b)=>b[1].total-a[1].total).map(([k,v]) => {
    const w = t => (t/v.total*100).toFixed(2)+"%";
    return '<tr><td>'+esc(k)+'</td><td class="mono">'+v.total+'</td>'+
      '<td class="pass">'+v.pass+'</td><td class="warn">'+v.warn+'</td><td class="fail">'+v.fail+'</td>'+
      '<td class="mono">'+v.avgScore+'</td>'+
      '<td><div class="bar"><i class="p" style="width:'+w(v.pass)+'"></i><i class="w" style="width:'+w(v.warn)+'"></i><i class="f" style="width:'+w(v.fail)+'"></i></div></td></tr>';
  }).join("");
  el.innerHTML = '<thead><tr><th>name</th><th>total</th><th>pass</th><th>warn</th><th>fail</th><th>avg score</th><th style="width:180px">mix</th></tr></thead><tbody>'+rows+'</tbody>';
}
breakdown(document.getElementById("bySuite"), S.bySuite);
breakdown(document.getElementById("byCategory"), S.byCategory);

if (RUN.linkReport && RUN.linkReport.length){
  document.getElementById("linkPanel").hidden = false;
  document.getElementById("links").innerHTML =
    '<thead><tr><th>url</th><th>status</th></tr></thead><tbody>' +
    RUN.linkReport.map(l => '<tr><td class="mono">'+esc(l.url)+'</td><td class="'+(l.ok?"pass":"fail")+'">'+

}

for (const [id, key] of [["suiteSel","suite"],["catSel","category"]]) {
  const sel = document.getElementById(id);
  [...new Set(RUN.cases.map(c => c[key]).filter(Boolean))].sort()
    .forEach(v => sel.insertAdjacentHTML("beforeend", '<option>'+esc(v)+'</option>'));
}

const ICON = { pass:"✔", warn:"▲", fail:"✘" };

    '</summary>'+
    '<div class="body">'+
      '<div class="metrics">'+metrics+'</div>'+
      ((c.reasons||[]).length ? '<div><h4>Findings</h4><ul class="reasons">'+
        c.reasons.map(r=>'<li class="'+(r.startsWith("CRITICAL")?"crit":"")+'">'+esc(r)+'</li>').join("")+'</ul></div>' : "")+
      '<div><h4>Question asked</h4><div class="txt">'+esc(c.question)+'</div></div>'+
      compare + turns + missing + nums + judge +
      (assertChips ? '<div><h4>Assertions</h4><div class="chips">'+assertChips+'</div></div>' : "")+
    '</div></details>';
}

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const suite = document.getElementById("suiteSel").value;
  const cat = document.getElementById("catSel").value;
  const list = RUN.cases.filter(c =>
    (filter === "all" || c.verdict === filter) &&
    (!suite || c.suite === suite) && (!cat || c.category === cat) &&
    (!q || (c.question+" "+c.reply+" "+(c.reasons||[]).join(" ")+" "+(c.label||"")).toLowerCase().includes(q)));
  const order = { fail:0, warn:1, pass:2 };
  list.sort((a,b) => order[a.verdict]-order[b.verdict] || a.score-b.score);
  document.getElementById("cases").innerHTML =
    list.length ? list.map(caseHtml).join("") : '<div class="empty">No cases match these filters.</div>';
}

document.querySelectorAll("button[data-v]").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("button[data-v]").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); filter = b.dataset.v; render();
}));
["q","suiteSel","catSel"].forEach(id => document.getElementById(id).addEventListener("input", render));
render();
</script>
</body>
</html>
